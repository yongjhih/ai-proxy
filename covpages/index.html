<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unit test coverage report with multi-commit trends powered by covpages">
  <meta name="color-scheme" content="light dark">
  <title>ai-proxy Coverage - covpages</title>
  <style>

/* Primer-inspired GitHub theme design tokens (Restrained & Impeccable compliant) */
:root {
  color-scheme: light dark;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-canvas-overlay: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #59636e;
  --color-fg-subtle: #656d76;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: rgba(9, 105, 218, 0.08);
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: rgba(26, 127, 55, 0.08);
  --color-success-line: rgba(26, 127, 55, 0.06);
  --color-success-gutter: rgba(26, 127, 55, 0.14);
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: rgba(207, 34, 46, 0.08);
  --color-danger-line: rgba(207, 34, 46, 0.07);
  --color-danger-gutter: rgba(207, 34, 46, 0.15);
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-attention-subtle: rgba(154, 103, 0, 0.08);
  --color-neutral-subtle: rgba(129, 139, 152, 0.1);
  --color-neutral-emphasis: #656d76;
  --color-tab-indicator: #1f2328;

  --chart-grid: #eaeef2;
  --chart-line: #59636e;
  --chart-fill: rgba(89, 99, 110, 0.06);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 0 rgba(31, 35, 40, 0.04);
  --shadow-rest: 0 4px 12px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-color-mode="light"]) {
    color-scheme: dark;
    --color-canvas-default: #0d1117;
    --color-canvas-subtle: #161b22;
    --color-canvas-inset: #010409;
    --color-canvas-overlay: #161b22;
    --color-border-default: #30363d;
    --color-border-muted: #21262d;
    --color-fg-default: #e6edf3;
    --color-fg-muted: #8b949e;
    --color-fg-subtle: #6e7681;
    --color-accent-fg: #4493f8;
    --color-accent-emphasis: #1f6feb;
    --color-accent-subtle: rgba(56, 139, 253, 0.1);
    --color-success-fg: #3fb950;
    --color-success-emphasis: #238636;
    --color-success-subtle: rgba(46, 160, 67, 0.1);
    --color-success-line: rgba(46, 160, 67, 0.07);
    --color-success-gutter: rgba(46, 160, 67, 0.16);
    --color-danger-fg: #f85149;
    --color-danger-emphasis: #da3633;
    --color-danger-subtle: rgba(248, 81, 73, 0.1);
    --color-danger-line: rgba(248, 81, 73, 0.08);
    --color-danger-gutter: rgba(248, 81, 73, 0.18);
    --color-attention-fg: #d29922;
    --color-attention-emphasis: #9e6a03;
    --color-attention-subtle: rgba(187, 128, 9, 0.1);
    --color-neutral-subtle: rgba(110, 118, 129, 0.12);
    --color-neutral-emphasis: #6e7681;
    --color-tab-indicator: #e6edf3;

    --chart-grid: #21262d;
    --chart-line: #8b949e;
    --chart-fill: rgba(139, 148, 158, 0.08);
    --shadow-rest: 0 4px 12px rgba(1, 4, 9, 0.45), 0 1px 3px rgba(1, 4, 9, 0.3);
  }
}

:root[data-theme="dark"],
:root[data-color-mode="dark"] {
  color-scheme: dark;
  --color-canvas-default: #0d1117;
  --color-canvas-subtle: #161b22;
  --color-canvas-inset: #010409;
  --color-canvas-overlay: #161b22;
  --color-border-default: #30363d;
  --color-border-muted: #21262d;
  --color-fg-default: #e6edf3;
  --color-fg-muted: #8b949e;
  --color-fg-subtle: #6e7681;
  --color-accent-fg: #4493f8;
  --color-accent-emphasis: #1f6feb;
  --color-accent-subtle: rgba(56, 139, 253, 0.1);
  --color-success-fg: #3fb950;
  --color-success-emphasis: #238636;
  --color-success-subtle: rgba(46, 160, 67, 0.1);
  --color-success-line: rgba(46, 160, 67, 0.07);
  --color-success-gutter: rgba(46, 160, 67, 0.16);
  --color-danger-fg: #f85149;
  --color-danger-emphasis: #da3633;
  --color-danger-subtle: rgba(248, 81, 73, 0.1);
  --color-danger-line: rgba(248, 81, 73, 0.08);
  --color-danger-gutter: rgba(248, 81, 73, 0.18);
  --color-attention-fg: #d29922;
  --color-attention-emphasis: #9e6a03;
  --color-attention-subtle: rgba(187, 128, 9, 0.1);
  --color-neutral-subtle: rgba(110, 118, 129, 0.12);
  --color-neutral-emphasis: #6e7681;
  --color-tab-indicator: #e6edf3;

  --chart-grid: #21262d;
  --chart-line: #8b949e;
  --chart-fill: rgba(139, 148, 158, 0.08);
  --shadow-rest: 0 4px 12px rgba(1, 4, 9, 0.45), 0 1px 3px rgba(1, 4, 9, 0.3);
}

:root[data-theme="light"],
:root[data-color-mode="light"] {
  color-scheme: light;
  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-canvas-overlay: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #59636e;
  --color-fg-subtle: #656d76;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: rgba(9, 105, 218, 0.08);
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: rgba(26, 127, 55, 0.08);
  --color-success-line: rgba(26, 127, 55, 0.06);
  --color-success-gutter: rgba(26, 127, 55, 0.14);
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: rgba(207, 34, 46, 0.08);
  --color-danger-line: rgba(207, 34, 46, 0.07);
  --color-danger-gutter: rgba(207, 34, 46, 0.15);
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-attention-subtle: rgba(154, 103, 0, 0.08);
  --color-neutral-subtle: rgba(129, 139, 152, 0.1);
  --color-neutral-emphasis: #656d76;
  --color-tab-indicator: #1f2328;

  --chart-grid: #eaeef2;
  --chart-line: #59636e;
  --chart-fill: rgba(89, 99, 110, 0.06);
  --shadow-rest: 0 4px 12px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
}

*, *::before, *::after {
  box-sizing: border-box;
}

::selection {
  background-color: var(--color-accent-subtle);
  color: var(--color-fg-default);
}

html {
  scrollbar-color: var(--color-border-default) transparent;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  caret-color: var(--color-fg-default);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  text-underline-offset: 0.2em;
}

/* Header bar */
.gh-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 24px;
}

.gh-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.gh-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--color-fg-default);
  font-weight: 600;
  font-size: 15px;
}

.gh-brand-icon {
  display: flex;
  align-items: center;
  color: var(--color-fg-default);
}

.gh-repo-title {
  color: var(--color-fg-muted);
  font-weight: 500;
}

.gh-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* GitHub Primer + shadcn/ui Restrained Buttons & Selectors */
.gh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 20px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-decoration: none;
  transition: background-color 120ms cubic-bezier(0.25, 1, 0.5, 1), border-color 120ms cubic-bezier(0.25, 1, 0.5, 1);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.gh-btn:hover {
  background-color: var(--color-canvas-subtle);
  border-color: var(--color-border-default);
}

.gh-btn:active {
  background-color: var(--color-neutral-subtle);
}

.gh-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
  outline-offset: 1px;
}

.gh-btn-primary {
  color: var(--color-canvas-default);
  background-color: var(--color-fg-default);
  border-color: var(--color-fg-default);
  font-weight: 500;
}

.gh-btn-primary:hover {
  opacity: 0.9;
  background-color: var(--color-fg-default);
}

/* Ref (Branch/Tag) Selector Popover */
.ref-selector-wrap {
  position: relative;
}

.ref-selector-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.ref-btn-label {
  font-weight: 600;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dropdown-caret {
  font-size: 10px;
  margin-left: 2px;
  color: var(--color-fg-muted);
}

.ref-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 300px;
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-rest);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ref-popover-header {
  padding: 8px 10px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
}

.ref-popover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ref-popover-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.ref-popover-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 13px;
  color: var(--color-fg-muted);
  border-radius: var(--radius-sm);
}

.ref-popover-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.ref-search-wrap {
  margin-bottom: 8px;
}

.ref-search-input {
  width: 100%;
  padding: 5px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm);
  outline: none;
}

.ref-search-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.ref-search-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.ref-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--color-border-muted);
  margin-top: 4px;
}

.ref-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-muted);
  cursor: pointer;
  margin-bottom: -1px;
}

.ref-tab:hover {
  color: var(--color-fg-default);
}

.ref-tab.active {
  color: var(--color-fg-default);
  border-bottom-color: var(--color-tab-indicator);
  font-weight: 600;
}

.ref-list {
  max-height: 250px;
  overflow-y: auto;
  padding: 4px 0;
}

.ref-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--color-fg-default);
  cursor: pointer;
  gap: 8px;
  text-decoration: none;
}

.ref-item:hover, .ref-item.active {
  background-color: var(--color-canvas-subtle);
}

.ref-item.selected {
  font-weight: 600;
}

.ref-item-check {
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-fg-default);
  flex-shrink: 0;
}

.ref-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ref-item-badge {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  margin-left: auto;
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

.ref-empty {
  padding: 16px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

/* Tabs */
.gh-nav-tabs {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 0 24px;
}

.gh-nav-tabs-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.gh-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-fg-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.gh-tab:hover {
  color: var(--color-fg-default);
}

.gh-tab.active {
  color: var(--color-fg-default);
  font-weight: 600;
  border-bottom-color: var(--color-tab-indicator);
}

.gh-tab .counter {
  display: inline-block;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 18px;
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
  border-radius: 20px;
}

/* Main Container */
.gh-container {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
}

/* Compact Summary Strip (replaces oversized hero metric cards) */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  background-color: var(--color-canvas-default);
  margin-bottom: 20px;
  overflow: hidden;
}

.metric-card {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--color-border-muted);
}

.metric-card:last-child {
  border-right: none;
}

.metric-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.metric-value-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.metric-percent {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-default);
}

.metric-counts {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-muted);
}

/* Progress bar */
.progress-bar-container {
  height: 4px;
  background-color: var(--color-border-muted);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 2px;
}

/* Delta badges */
.delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  border-radius: var(--radius-sm);
  line-height: 16px;
  border: 1px solid transparent;
}

.delta-badge.positive {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.delta-badge.negative {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

.delta-badge.neutral {
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

/* GitHub Commit Banner */
.commit-banner {
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.commit-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.commit-author-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background-color: var(--color-neutral-subtle);
  border: 1px solid var(--color-border-default);
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

.commit-message {
  font-weight: 500;
  color: var(--color-fg-default);
}

.commit-meta {
  color: var(--color-fg-muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.commit-sha-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  background-color: var(--color-neutral-subtle);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Toolbar & Breadcrumbs */
.file-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--color-fg-muted);
  flex-wrap: wrap;
}

.breadcrumb-item {
  color: var(--color-accent-fg);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.breadcrumb-item:hover {
  text-decoration: underline;
}

.breadcrumb-separator {
  color: var(--color-fg-muted);
}

.search-box {
  position: relative;
  min-width: 220px;
}

.search-box input {
  width: 100%;
  padding: 5px 10px 5px 30px;
  font-size: 13px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.search-box input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.search-box input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

/* File Table */
.gh-box {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.table-wrapper {
  overflow-x: auto;
  max-inline-size: 100%;
}

table.gh-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

table.gh-table th {
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-muted);
  font-weight: 600;
  padding: 8px 16px;
  border-bottom: 1px solid var(--color-border-default);
  white-space: nowrap;
  user-select: none;
}

table.gh-table th.sortable {
  cursor: pointer;
}

table.gh-table th.sortable:hover {
  color: var(--color-fg-default);
}

table.gh-table td {
  padding: 8px 16px;
  border-top: 1px solid var(--color-border-muted);
  color: var(--color-fg-default);
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
}

table.gh-table tbody tr:first-child td {
  border-top: none;
}

table.gh-table tbody tr:hover td {
  background-color: var(--color-canvas-subtle);
}

.file-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.file-name-cell svg {
  color: var(--color-fg-muted);
}

.file-link {
  color: var(--color-fg-default);
  text-decoration: none;
  cursor: pointer;
}

.file-link:hover {
  color: var(--color-accent-fg);
  text-decoration: underline;
}

/* Rate Pill (Primer + shadcn/ui subtle badge) */
.rate-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  border: 1px solid transparent;
}

.rate-high {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.rate-medium {
  color: var(--color-attention-fg);
  background-color: var(--color-attention-subtle);
}

.rate-low {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

/* Charts */
.chart-container {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 24px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-fg-default);
}

.chart-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.svg-chart {
  width: 100%;
  height: 220px;
  overflow: visible;
}

.chart-dot {
  cursor: pointer;
  transition: r 0.15s cubic-bezier(0.25, 1, 0.5, 1), fill 0.15s cubic-bezier(0.25, 1, 0.5, 1);
}

.chart-dot:hover {
  r: 5;
  fill: var(--color-fg-default);
}

/* Tooltip */
.chart-tooltip {
  position: absolute;
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow-rest);
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.15s cubic-bezier(0.25, 1, 0.5, 1);
  white-space: nowrap;
}

/* Code Viewer */
.blob-wrapper {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.blob-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--color-fg-muted);
}

.blob-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.code-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.code-table td {
  padding: 0 8px;
}

.code-table tr:hover td {
  background-color: var(--color-neutral-subtle);
}

.blob-num {
  width: 1%;
  min-width: 48px;
  text-align: right;
  color: var(--color-fg-subtle);
  font-variant-numeric: tabular-nums;
  user-select: none;
  cursor: pointer;
  border-right: 1px solid var(--color-border-muted);
}

.blob-hits {
  width: 1%;
  min-width: 36px;
  text-align: right;
  color: var(--color-fg-muted);
  font-variant-numeric: tabular-nums;
  user-select: none;
  font-size: 11px;
  border-right: 1px solid var(--color-border-muted);
}

.blob-code {
  white-space: pre-wrap;
  word-break: break-all;
  padding-left: 12px !important;
}

/* Line Coverage Highlighting (Softened GitHub Primer diff style) */
tr.line-covered {
  background-color: var(--color-success-line);
}

tr.line-covered .blob-num,
tr.line-covered .blob-hits {
  background-color: var(--color-success-gutter);
}

tr.line-covered .blob-hits {
  color: var(--color-success-fg);
  font-weight: 500;
}

tr.line-uncovered {
  background-color: var(--color-danger-line);
}

tr.line-uncovered .blob-num,
tr.line-uncovered .blob-hits {
  background-color: var(--color-danger-gutter);
}

tr.line-uncovered .blob-hits {
  color: var(--color-danger-fg);
  font-weight: 600;
}

/* GitHub Primer Syntax Highlighting Tokens (Light) */
.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #59636e; font-style: italic; }
.token.punctuation { color: #1f2328; }
.token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #0550ae; }
.token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #0a3069; }
.token.operator, .token.entity, .token.url { color: #0550ae; }
.token.atrule, .token.attr-value, .token.keyword { color: #cf222e; font-weight: 500; }
.token.function, .token.class-name { color: #6639ba; }
.token.regex, .token.important, .token.variable { color: #953800; }

/* GitHub Primer Syntax Highlighting Tokens (Dark Mode) */
[data-theme="dark"] .token.comment,
[data-theme="dark"] .token.prolog,
[data-theme="dark"] .token.doctype,
[data-theme="dark"] .token.cdata,
[data-color-mode="dark"] .token.comment,

[data-color-mode="dark"] .token.cdata { color: #8b949e; font-style: italic; }

[data-color-mode="dark"] .token.punctuation { color: #e6edf3; }
[data-theme="dark"] .token.property,
[data-theme="dark"] .token.tag,
[data-theme="dark"] .token.boolean,
[data-theme="dark"] .token.number,
[data-theme="dark"] .token.constant,
[data-theme="dark"] .token.symbol,

[data-color-mode="dark"] .token.tag,
[data-color-mode="dark"] .token.boolean,
[data-color-mode="dark"] .token.number,
[data-color-mode="dark"] .token.constant,
[data-color-mode="dark"] .token.symbol { color: #79c0ff; }
[data-theme="dark"] .token.selector,
[data-theme="dark"] .token.attr-name,
[data-theme="dark"] .token.string,
[data-theme="dark"] .token.char,
[data-theme="dark"] .token.builtin,
[data-color-mode="dark"] .token.selector,
[data-color-mode="dark"] .token.attr-name,
[data-color-mode="dark"] .token.string,
[data-color-mode="dark"] .token.char,
[data-color-mode="dark"] .token.builtin { color: #a5d6ff; }
[data-theme="dark"] .token.operator,
[data-theme="dark"] .token.entity,
[data-theme="dark"] .token.url,
[data-color-mode="dark"] .token.operator,
[data-color-mode="dark"] .token.entity,
[data-color-mode="dark"] .token.url { color: #79c0ff; }
[data-theme="dark"] .token.atrule,
[data-theme="dark"] .token.attr-value,
[data-theme="dark"] .token.keyword,
[data-color-mode="dark"] .token.atrule,
[data-color-mode="dark"] .token.attr-value,
[data-color-mode="dark"] .token.keyword { color: #ff7b72; font-weight: 500; }
[data-theme="dark"] .token.function,
[data-theme="dark"] .token.class-name,
[data-color-mode="dark"] .token.function,
[data-color-mode="dark"] .token.class-name { color: #d2a8ff; }

[data-theme="dark"] .token.variable,
[data-color-mode="dark"] .token.regex,
[data-color-mode="dark"] .token.important,
[data-color-mode="dark"] .token.variable { color: #ffa657; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.comment,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.prolog,

  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.property,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.tag,

  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.selector,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.attr-name,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.string,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.char,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.builtin { color: #a5d6ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.operator,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.entity,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.url { color: #79c0ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.atrule,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.attr-value,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.keyword { color: #ff7b72; font-weight: 500; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.function,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.class-name { color: #d2a8ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.regex,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.important,

/* File Tree Sidebar & Layout */
.files-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  width: 100%;
}

.files-sidebar {
  width: 280px;
  flex-shrink: 0;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.files-layout.sidebar-collapsed .files-sidebar {
  display: none;
}

.files-main {
  flex: 1;
  min-width: 0;
}

.sidebar-header {
  padding: 8px 12px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-counter {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  background-color: var(--color-neutral-subtle);
  border-radius: 10px;
  color: var(--color-fg-muted);
}

.sidebar-btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-btn-icon:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.sidebar-btn-icon:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.goto-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--color-border-muted);
  background-color: var(--color-canvas-default);
  position: relative;
}

.goto-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.goto-input {
  width: 100%;
  padding: 5px 28px 5px 28px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.goto-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.goto-input:focus {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.goto-icon {
  position: absolute;
  left: 8px;
  color: var(--color-fg-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
  z-index: 1;
}

.goto-shortcut {
  position: absolute;
  right: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 4px;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: 3px;
  color: var(--color-fg-muted);
  pointer-events: none;
  line-height: 14px;
}

.goto-clear {
  position: absolute;
  right: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
}

.goto-clear:hover {
  color: var(--color-fg-default);
}

.tree-container {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 4px;
  flex: 1;
}

.tree-node {
  position: relative;
  display: flex;
  align-items: center;
  padding: 4px 8px;
  font-size: 12px;
  line-height: 20px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  gap: 6px;
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.tree-node:hover {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
}

.tree-node.selected {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.tree-node.selected::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 2px;
  background-color: var(--color-tab-indicator);
  border-radius: 1px;
}

.tree-node:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.tree-node[data-tree-folder] .tree-icon {
  color: var(--color-fg-muted);
}

.tree-node[data-tree-file] .tree-icon {
  color: var(--color-fg-subtle);
}

.tree-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--color-fg-muted);
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.tree-toggle-spacer {
  width: 16px;
  flex-shrink: 0;
}

.tree-icon {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.tree-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-badge {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 0 4px;
  border-radius: var(--radius-sm);
  margin-left: 4px;
  flex-shrink: 0;
  line-height: 16px;
  color: var(--color-fg-muted);
}

.tree-badge-high {
  color: var(--color-fg-muted);
}

.tree-badge-med {
  color: var(--color-attention-fg);
}

.tree-badge-low {
  color: var(--color-danger-fg);
}

.goto-results {
  overflow-y: auto;
  padding: 6px 4px;
  flex: 1;
}

.goto-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 8px;
  color: var(--color-fg-default);
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.goto-item:hover, .goto-item.active {
  background-color: var(--color-neutral-subtle);
}

.goto-item.selected {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.goto-item.selected::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background-color: var(--color-tab-indicator);
  border-radius: 1px;
}

.goto-item-path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
}

.goto-highlight {
  font-weight: 700;
  color: var(--color-accent-fg);
}

.goto-empty {
  padding: 24px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

.sidebar-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
}

.sidebar-toggle-btn:hover {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
}

.sidebar-toggle-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

/* Footer */
.gh-footer {
  border-top: 1px solid var(--color-border-default);
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--color-fg-muted);
  margin-top: auto;
}

.gh-footer a {
  color: var(--color-accent-fg);
  text-decoration: none;
}

.gh-footer a:hover {
  text-decoration: underline;
}

/* Badge Copy & Modal */
.badge-toolbar-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  font-size: 12px;
  line-height: 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-default);
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}

.badge-btn:hover {
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.badge-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.badge-svg-display {
  display: inline-flex;
  align-items: center;
  line-height: 0;
}

.badge-svg-display svg {
  display: block;
  height: 20px;
  width: auto;
  max-width: none;
  border-radius: 3px;
}

.badge-copy-text {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
  font-size: 12px;
}

/* Primer Toast Notification */
.gh-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 12px rgba(140, 149, 159, 0.2);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.gh-toast.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.gh-toast-icon {
  color: var(--color-success-fg);
  display: flex;
  align-items: center;
}

/* Badge Options Dialog / Popover */
.badge-modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.4);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.badge-modal {
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  animation: modalFadeIn 0.15s ease-out;
}

@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.badge-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-default);

-TW/spec',\n  'zh-TW/protocol',\n  'zh-TW/security'\n]);\n\nfunction escapeHtml(str) {\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/\u003e/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n\nexport function getRuntimeSiteBaseUrl(importMetaUrl, win = globalThis.window) {\n  try {\n    if (importMetaUrl) {\n      return new URL('../', importMetaUrl).href;\n    }\n  } catch {\n    // fallback\n  }\n  if (win && win.location) {\n    return new URL('./', win.location.href).href;\n  }\n  return 'https://example.github.io/ai-proxy/';\n}\n\nexport function replaceBaseUrlPlaceholder(text, siteBaseUrl) {\n  const normalizedBase = siteBaseUrl.endsWith('/') ? siteBaseUrl : `${siteBaseUrl}/`;\n  return String(text).replace(/https:\\/\\/\u003chost\u003e\\/\u003corg\u003e\\/\u003crepo\u003e\\//g, normalizedBase);\n}\n\nfunction renderInlineMarkdown(text) {\n  let out = escapeHtml(text);\n  out = out.replace(/`([^`]+)`/g, '\u003ccode\u003e$1\u003c/code\u003e');\n  out = out.replace(/\\*\\*([^*]+)\\*\\*/g, '\u003cstrong\u003e$1\u003c/strong\u003e');\n  out = out.replace(/\\*([^*]+)\\*/g, '\u003cem\u003e$1\u003c/em\u003e');\n  out = out.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '\u003ca href=\"$2\"\u003e$1\u003c/a\u003e');\n  return out;\n}\n\nexport function renderMarkdownToHtml(markdownText, siteBaseUrl) {\n  const substituted = replaceBaseUrlPlaceholder(markdownText, siteBaseUrl);\n  const lines = substituted.replace(/\\r\\n/g, '\\n').split('\\n');\n  const html = [];\n  let inCodeBlock = false;\n  let codeLang = '';\n  let codeLines = [];\n  let inList = null; // 'ul' | 'ol'\n  let inTable = false;\n  let tableHeaderDone = false;\n\n  function closeList() {\n    if (inList) {\n      html.push(`\u003c/${inList}\u003e`);\n      inList = null;\n    }\n  }\n\n  function closeTable() {\n    if (inTable) {\n      html.push('\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e');\n      inTable = false;\n      tableHeaderDone = false;\n    }\n  }\n\n  for (let i = 0; i \u003c lines.length; i += 1) {\n    const line = lines[i];\n\n    if (line.startsWith('```')) {\n      closeList();\n      closeTable();\n      if (!inCodeBlock) {\n        inCodeBlock = true;\n        codeLang = line.slice(3).trim();\n        codeLines = [];\n      } else {\n        const rawCode = codeLines.join('\\n');\n        if (codeLang === 'mermaid') {\n          html.push(`\u003cdiv class=\"mermaid\"\u003e${escapeHtml(rawCode)}\u003c/div\u003e`);\n        } else {\n          html.push(\n            `\u003cpre\u003e\u003ccode class=\"lang-${escapeHtml(codeLang || 'text')}\"\u003e${escapeHtml(rawCode)}\u003c/code\u003e\u003c/pre\u003e`\n          );\n        }\n        inCodeBlock = false;\n        codeLang = '';\n        codeLines = [];\n      }\n      continue;\n    }\n\n    if (inCodeBlock) {\n      codeLines.push(line);\n      continue;\n    }\n\n    const trimmed = line.trim();\n    if (!trimmed) {\n      closeList();\n      closeTable();\n      continue;\n    }\n\n    if (trimmed === '---') {\n      closeList();\n      closeTable();\n      html.push('\u003chr style=\"border:none;border-top:1px solid var(--border-muted);margin:1.75rem 0;\" /\u003e');\n      continue;\n    }\n\n    // Table row\n    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {\n      closeList();\n      const cells = trimmed\n        .slice(1, -1)\n        .split('|')\n        .map((c) =\u003e c.trim());\n      if (cells.every((c) =\u003e /^:?-{2,}:?$/.test(c))) {\n        continue;\n      }\n      if (!inTable) {\n        inTable = true;\n        tableHeaderDone = false;\n        html.push('\u003cdiv class=\"data-table-wrap\"\u003e\u003ctable class=\"data-table\"\u003e');\n      }\n      if (!tableHeaderDone) {\n        html.push(\n          `\u003cthead\u003e\u003ctr\u003e${cells.map((c) =\u003e `\u003cth\u003e${renderInlineMarkdown(c)}\u003c/th\u003e`).join('')}\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e`\n        );\n        tableHead e":"runCommand","line":16,"hits":3},{"name":"anonymous_1","line":17,"hits":3},{"name":"anonymous_2","line":18,"hits":3},{"name":"parseFlags","line":30,"hits":37},{"name":"printWarningsToStderr","line":74,"hits":4},{"name":"registerSiteInClaude","line":80,"hits":2},{"name":"removeSiteFromClaude","line":88,"hits":1},{"name":"runCli","line":93,"hits":17},{"name":"openBrowser","line":151,"hits":1},{"name":"onSiteAdded","line":169,"hits":0},{"name":"onSiteRemoved","line":170,"hits":0},{"name":"anonymous_11","line":283,"hits":1},{"name":"anonymous_12","line":315,"hits":1},{"name":"anonymous_13","line":373,"hits":7},{"name":"anonymous_14","line":411,"hits":2},{"name":"anonymous_15","line":413,"hits":12},{"name":"anonymous_16","line":441,"hits":6}],"sourceCode":"import fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport readline from 'node:readline';\nimport { execFile } from 'node:child_process';\nimport { fileURLToPath } from 'node:url';\nimport { createStore, validateAllowToolSpec } from './store.mjs';\nimport { createRelayServer, defaultOpenBrowser } from './relay.mjs';\nimport { runDockerWrapper, runDevcontainerSubcommand } from './docker.mjs';\nimport { normalizePageUrl } from '../web/url.mjs';\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));\nconst REPO_ROOT = path.resolve(__dirname, '..');\nconst WEB_MODULES_DIR = path.join(REPO_ROOT, 'web');\n\nfunction runCommand(bin, args, env) {\n  return new Promise((resolve, reject) =\u003e {\n    execFile(bin, args, { env: { ...process.env, ...env } }, (err, stdout, stderr) =\u003e {\n      if (err) {\n        err.stdout = stdout;\n        err.stderr = stderr;\n        reject(err);\n        return;\n      }\n      resolve({ stdout, stderr });\n    });\n  });\n}\n\nfunction parseFlags(args) {\n  const positionals = [];\n  const flags = {\n    allowTools: []\n  };\n\n  for (let i = 0; i \u003c args.length; i += 1) {\n    const arg = args[i];\n    if (arg === '--port' || arg === '-p') {\n      flags.port = Number.parseInt(args[++i] || '', 10);\n    } else if (arg === '--host') {\n      flags.host = args[++i];\n    } else if (arg === '--url') {\n      flags.url = args[++i];\n    } else if (arg === '--name') {\n      flags.name = args[++i];\n    } else if (arg === '--ttl') {\n      flags.ttl = Number.parseFloat(args[++i] || '');\n    } else if (arg === '--dir') {\n      flags.dir = args[++i];\n    } else if (arg === '--out' || arg === '-o') {\n      flags.out = args[++i];\n    } else if (arg === '--allow-tool') {\n      flags.allowTools.push(args[++i]);\n    } else if (arg === '--origin') {\n      flags.origin = true;\n    } else if (arg === '--json') {\n      flags.json = true;\n    } else if (arg === '--all') {\n      flags.all = true;\n    } else if (arg === '--admin') {\n      flags.admin = true;\n    } else if (arg === '--login') {\n      flags.login = true;\n    } else if (arg === '--help' || arg === '-h') {\n      flags.help = true;\n    } else {\n      positionals.push(arg);\n    }\n  }\n\n  return { positionals, flags };\n}\n\nfunction printWarningsToStderr(store, stderr) {\n  for (const w of store.getWarnings()) {\n    stderr.write(`${w}\\n`);\n  }\n}\n\nexport async function registerSiteInClaude(site, port, env = process.env, host = '127.0.0.1') {\n  const claudeBin = env.AI_PROXY_CLAUDE_BIN || 'claude';\n  const effectiveHost = env.AI_PROXY_HOST || host || '127.0.0.1';\n  const endpoint = `http://${effectiveHost}:${port}/mcp?url=${encodeURIComponent(site.url)}`;\n  await runCommand(claudeBin, ['mcp', 'add', '--transport', 'http', site.name, endpoint], env);\n  return endpoint;\n}\n\nexport async function removeSiteFromClaude(name, env = process.env) {\n  const claudeBin = env.AI_PROXY_CLAUDE_BIN || 'claude';\n  await runCommand(claudeBin, ['mcp', 'remove', name], env);\n}\n\nexport async function runCli(\n  argv = process.argv.slice(2),\n  {\n    env = process.env,\n    stdin = process.stdin,\n    stdout = process.stdout,\n    stderr = process.stderr\n  } = {}\n) {\n  const firstArg = argv[0];\n  if (firstArg === 'docker' || firstArg === 'docker-wrapper') {\n    return runDockerWrapper(argv.slice(1), { env, stdout, stderr });\n  }\n  if (firstArg === 'devcontainer') {\n    return runDevcontainerSubcommand(argv.slice(1), { env, stdout, stderr });\n  }\n\n  const { positionals, flags } = parseFlags(argv);\n  const subcommand = positionals[0];\n\n  if (!subcommand || flags.help || subcommand === 'help') {\n    stderr.write(\n      `Usage: ai-proxy \u003ccommand\u003e [options]\n\nCommands:\n  serve [--port 8788] [--allow-tool mcp__\u003cserver\u003e__\u003ctool\u003e]\n  mcp --url \u003cpage_url\u003e [--port 8788]\n  add \u003cpage_url\u003e [--name \u003cslug\u003e] [--port 8788]\n  remove \u003cpage_url_or_name\u003e\n  allow \u003curl_prefix\u003e\n  allow-origin \u003corigin|*\u003e [--ttl \u003cseconds\u003e]\n  deny \u003curl_prefix_or_origin\u003e [--origin]\n  sites [--json]\n  doctor [--dir \u003csite_dir\u003e]\n  open [dashboard|\u003cpage_url\u003e] [--port 8788]\n  keys rotate [\u003cpage_url\u003e|--all|--admin]\n  vendor \u003ctarget_dir\u003e\n  install --login [--port 8788]\n  docker \u003csubcommand|run\u003e [args...]\n  docker-wrapper \u003csubcommand|run\u003e [args...]\n  devcontainer [init|up|exec] [--dir \u003cdir\u003e] [--port 8788]\n`\n    );\n    return subcommand === 'help' || flags.help ? 0 : 2;\n  }\n\n  const configDir =\n    env.AI_PROXY_HOME || path.join(env.HOME || os.homedir(), '.config', 'ai-proxy');\n  const store = createStore({ configDir });\n  const envPort = Number.parseInt(env.AI_PROXY_PORT || '', 10);\n  const port =\n    Number.isInteger(flags.port) && flags.port \u003e= 0\n      ? flags.port\n      : Number.isInteger(envPort) && envPort \u003e 0\n        ? envPort\n        : 8788;\n  const host = flags.host || env.AI_PROXY_HOST || '127.0.0.1';\n  const openBrowser =\n    env.AI_PROXY_NO_BROWSER === '1' ? async () =\u003e true : defaultOpenBrowser; us_10","line":270,"hits":0},{"name":"anonymous_11","line":343,"hits":9}],"sourceCode":"import fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { spawn } from 'node:child_process';\nimport { fileURLToPath } from 'node:url';\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));\nconst REPO_ROOT = path.resolve(__dirname, '..');\n\nfunction execSpawn(bin, args, { env = process.env, stdio = 'inherit', stdout, stderr } = {}) {\n  return new Promise((resolve, reject) =\u003e {\n    const child = spawn(bin, args, {\n      env: { ...process.env, ...env },\n      stdio: stdout || stderr ? ['ignore', 'pipe', 'pipe'] : stdio\n    });\n    if (stdout && child.stdout) {\n      child.stdout.on('data', (chunk) =\u003e stdout.write(chunk));\n    }\n    if (stderr && child.stderr) {\n      child.stderr.on('data', (chunk) =\u003e stderr.write(chunk));\n    }\n    child.on('error', reject);\n    child.on('close', (code) =\u003e resolve(code ?? 0));\n  });\n}\n\n/**\n * Build the `docker` CLI argument list for either:\n * 1. Wrapping `docker run \u003cuser_args...\u003e` with ai-proxy host bridge env/mounts, or\n * 2. Running an `ai-proxy` subcommand (`serve`, `add`, `mcp`, `doctor`, etc.) inside the ai-proxy container.\n */\nexport function buildDockerWrapperPlan(\n  argv = [],\n  {\n    env = process.env,\n    cwd = process.cwd(),\n    repoRoot = REPO_ROOT\n  } = {}\n) {\n  const imageName = env.AI_PROXY_DOCKER_IMAGE || 'ai-proxy:local';\n  const defaultPort = Number.parseInt(env.AI_PROXY_PORT || '8788', 10) || 8788;\n  const homeDir = env.HOME || os.homedir();\n  const configDir = path.resolve(\n    env.AI_PROXY_HOME || path.join(homeDir, '.config', 'ai-proxy')\n  );\n\n  // Strip optional leading flags meant for the wrapper itself\n  const rest = [...argv];\n  let dryRun = false;\n  let forceBuild = false;\n  let customPort = null;\n\n  for (let i = 0; i \u003c rest.length; i += 1) {\n    if (rest[i] === '--dry-run') {\n      dryRun = true;\n      rest.splice(i, 1);\n      i -= 1;\n    } else if (rest[i] === '--build') {\n      forceBuild = true;\n      rest.splice(i, 1);\n      i -= 1;\n    } else if ((rest[i] === '--port' || rest[i] === '-p') && rest[i + 1]) {\n      const parsed = Number.parseInt(rest[i + 1], 10);\n      if (Number.isInteger(parsed) && parsed \u003e= 0) {\n        customPort = parsed;\n      }\n    }\n  }\n\n  const port = customPort !== null ? customPort : defaultPort;\n  const first = rest[0] || 'serve';\n\n  // Mode 1: Wrapping `docker run ...` so a container (e.g. Claude Code container) can reach host ai-proxy\n  if (first === 'run') {\n    const userRunArgs = rest.slice(1);\n    const runArgs = [\n      'run',\n      '--add-host=host.docker.internal:host-gateway',\n      '-e',\n      'AI_PROXY_HOST=host.docker.internal',\n      '-e',\n      `AI_PROXY_PORT=${port}`,\n      '-e',\n      `AI_PROXY_URL=http://host.docker.internal:${port}`,\n      '-v',\n      `${configDir}:/root/.config/ai-proxy`,\n      ...userRunArgs\n    ];\n    return {\n      mode: 'wrap-docker-run',\n      dryRun,\n      forceBuild: false,\n      imageName,\n      port,\n      configDir,\n      repoRoot,\n      dockerArgs: runArgs\n    };\n  }\n\n  // Mode 2: Running ai-proxy itself inside Docker (`serve`, `mcp`, `add`, `sites`, `doctor`, `vendor`, etc.)\n  const subcommand = first;\n  const dockerArgs = [\n    'run',\n    '--rm',\n    '-i',\n    '--add-host=host.docker.internal:host-gateway',\n    '-e',\n    'AI_PROXY_HOME=/data/ai-proxy',\n    '-v',\n    `${configDir}:/data/ai-proxy`,\n    '-v',\n    `${path.resolve(cwd)}:/workspace`,\n    '-w',\n    '/workspace'\n  ];\n\n  let containerCmdArgs = [...rest];\n  if (containerCmdArgs.length === 0) {\n    containerCmdArgs = ['serve'];\n  }\n\n  if (subcommand === 'serve') {\n    dockerArgs.push('-p', `127.0.0.1:${port}:8788`);\n    if (!containerCmdArgs.includes('--host')) {\n      containerCmdArgs.push('--host', '0.0.0.0');\n    }\n    if (!containerCmdArgs.includes('--port') && !containerCmdArgs.includes('-p')) {\n      containerCmdArgs.push('--port', '8788');\n    }\n  } else if (subcommand === 'mcp') {\n    if (!containerCmdArgs.includes('--host')) {\n      containerCmdArgs.push('--host', 'host.docker.internal');\n    }\n  }\n\n  dockerArgs.push(imageName, ...containerCmdArgs);\n\n  return {\n    mode: 'containerized-ai-proxy',\n    subcommand,\n    dryRun,\n    forceBuild,\n    imageName,\n    port,\n    configDir,\n    repoRoot,\n    dockerArgs\n  };\n}\n\nexport async function runDockerWrapper(\n  argv = [],\n  {\n    env = process.env,\n    cwd = process.cwd(),\n    stdout = process.stdout,\n    stderr = process.stderr\n  } = {}\n) {\n  if (argv.includes('--help') || argv.includes('-h') || argv[0] === 'help') {\n    stderr.write(\n      `Usage: ai-proxy-docker [options] \u003ccommand\u003e [args...]\n       ai-proxy docker [options] \u003ccommand\u003e [args...]\n\nModes:\n  1. Run ai-proxy inside Docker (zero host Node setup required):\n     ai-proxy-docker serve [--port 8788]\n     ai-proxy-docker add https://example.github.io/docs/mcp.html --name docs\n     ai-proxy-docker mcp --url https://example.github.io/docs/mcp.html\n     ai-proxy-docker doctor --dir .\n\n  2. Wrap \"docker run\" so containerized AI tools (e.g. Claude Code) connect to host ai-proxy:\n     ai-proxy-docker run [docker_run_flags] \u003cimage\u003e [command...]\n\nOptions:\n  --port, -p \u003cport\u003e   Host ai-proxy port (default: 8788 or $AI_PROXY_PORT)\n  --build             Force rebuild of the ai-proxy Docker image\n  --dry-run           Print the resolved docker command JSON to stdout without executing\n`\n    );\n    return 0;\n  }\n\n  const dockerBin = env.AI_PROXY_DOCKER_BIN || 'docker';\n  const plan = buildDockerWrapperPlan(argv, { env, cwd });\n\n  fs.mkdirSync(plan.configDir, { recursive: true });\n\n  if (plan.dryRun) {\n    stdout.write(\n      `${JSON.stringify({\n        ok: true,\n        mode: plan.mode,\n {\n    forwardPorts.push(port);\n  }\n\n  const runArgs = Array.isArray(existing.runArgs) ? [...existing.runArgs] : [];\n  if (!runArgs.some((a) =\u003e a.startsWith('--add-host=host.docker.internal:'))) {\n    runArgs.push('--add-host=host.docker.internal:host-gateway');\n  }\n\n  const mounts = Array.isArray(existing.mounts) ? [...existing.mounts] : [];\n  const configMount =\n    'source=${localEnv:HOME}/.config/ai-proxy,target=/home/node/.config/ai-proxy,type=bind,consistency=cached';\n  if (!mounts.some((m) =\u003e String(m).includes('.config/ai-proxy'))) {\n    mounts.push(configMount);\n  }\n\n  const nextConfig = {\n    name: existing.name || name,\n    ...(existing.image || existing.build || existing.dockerComposeFile\n      ? {}\n      : { image: 'mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm' }),\n    ...existing,\n    forwardPorts,\n    portsAttributes: {\n      ...(existing.portsAttributes || {}),\n      [String(port)]: {\n        label: 'ai-proxy Local Relay',\n        onAutoForward: 'notify'\n      }\n    },\n    runArgs,\n    containerEnv: {\n      ...(existing.containerEnv || {}),\n      AI_PROXY_HOST: 'host.docker.internal',\n      AI_PROXY_PORT: String(port),\n      AI_PROXY_URL: `http://host.docker.internal:${port}`,\n      AI_PROXY_HOME: '/home/node/.config/ai-proxy'\n    },\n    mounts\n  };\n\n  fs.writeFileSync(devcontainerJsonPath, `${JSON.stringify(nextConfig, null, 2)}\\n`, 'utf8');\n  return {\n    devcontainerJsonPath,\n    config: nextConfig\n  };\n}\n\nexport async function runDevcontainerSubcommand(\n  argv = [],\n  {\n    env = process.env,\n    cwd = process.cwd(),\n    stdout = process.stdout,\n    stderr = process.stderr\n  } = {}\n) {\n  const action = argv[0] && !argv[0].startsWith('-') ? argv[0] : 'init';\n  let targetDir = cwd;\n  let port = Number.parseInt(env.AI_PROXY_PORT || '8788', 10) || 8788;\n\n  for (let i = 0; i \u003c argv.length; i += 1) {\n    if (argv[i] === '--dir' && argv[i + 1]) {\n      targetDir = argv[++i];\n    } else if ((argv[i] === '--port' || argv[i] === '-p') && argv[i + 1]) {\n      port = Number.parseInt(argv[++i], 10) || 8788;\n    }\n  }\n\n  if (action === 'init') {\n    const { devcontainerJsonPath, config } = initDevcontainerConfig(targetDir, { port });\n    stderr.write(`Configured .devcontainer in ${devcontainerJsonPath}\\n`);\n    stdout.write(\n      `${JSON.stringify({\n        ok: true,\n        devcontainerJsonPath,\n        forwardPorts: config.forwardPorts,\n        containerEnv: config.containerEnv\n      })}\\n`\n    );\n    return 0;\n  }\n\n  if (action === 'up' || action === 'exec') {\n    const devcontainerBin = env.AI_PROXY_DEVCONTAINER_BIN || 'devcontainer';\n    const extraArgs = argv.slice(1).filter((a, idx, arr) =\u003e {\n      if (a === '--dir') return false;\n      if (idx \u003e 0 && arr[idx - 1] === '--dir') return false;\n      return true;\n    });\n    const cmdArgs = [\n      action,\n      '--workspace-folder',\n      path.resolve(targetDir),\n      '--remote-env',\n      'AI_PROXY_HOST=host.docker.internal',\n      '--remote-env',\n      `AI_PROXY_PORT=${port}`,\n      '--remote-env',\n      `AI_PROXY_URL=http://host.docker.internal:${port}`,\n      ...extraArgs\n    ];\n    return execSpawn(devcontainerBin, cmdArgs, { env, stdout, stderr });\n  }\n\n  stderr.write(`Error: unknown devcontainer action \"${action}\". Expected init, up, or exec.\\n`);\n  return 2;\n}\n"},"src/relay.mjs":{"path":"src/relay.mjs","lines":{"total":1221,"covered":955,"skipped":266,"pct":78.21},"functions":{"total":47,"covered":41,"skipped":6,"pct":87.23},"branches":{"total":275,"covered":192,"skipped":83,"pct":69.82},"lineDetails":{"1":{"hits":5,"branches":{"total":1,"taken":1}},"2":{"hits":5},"3":{"hits":5},"4":{"hits":5},"5":{"hits":5},"6":{"hits":5},"7":{"hits":5},"8":{"hits":5},"9":{"hits":5},"10":{"hits":5},"11":{"hits":5},"12":{"hits":5},"13":{"hits":5},"14":{"hits":5},"15":{"hits":5},"16":{"hits":5},"17":{"hits":5},"18":{"hits" nction handleMcpRoute(req, res) {\n    // Rule 3: /mcp rejects any request carrying an Origin header\n    if (req.headers.origin) {\n      sendJson(\n        req,\n        res,\n        403,\n        { error: 'Origin header is not allowed on /mcp (web pages cannot act as MCP clients)' },\n        { cors: true }\n      );\n      return;\n    }\n\n    // Claude Code SSE GET probe -\u003e 405 Method Not Allowed\n    if (req.method === 'GET') {\n      sendJson(\n        req,\n        res,\n        405,\n        { error: 'SSE GET is not supported on /mcp; use POST for JSON responses' },\n        { cors: false, extraHeaders: { Allow: 'POST' } }\n      );\n      return;\n    }\n\n    if (req.method !== 'POST') {\n      sendJson(req, res, 405, { error: 'Method not allowed' }, { cors: false, extraHeaders: { Allow: 'POST' } });\n      return;\n    }\n\n    const targetUrl = parseMcpRouteUrl(req.url);\n    if (!targetUrl) {\n      sendJson(req, res, 400, { error: 'Invalid or missing target URL on /mcp' }, { cors: false });\n      return;\n    }\n\n    // Rule 2: Verify target URL is in allowlist (or localhost)\n    if (!activeStore.isUrlAllowed(targetUrl)) {\n      sendJson(\n        req,\n        res,\n        403,\n        {\n          error: `Target URL is not in allowlist: ${targetUrl}. Run \"ai-proxy allow ${targetUrl}\" first.`,\n          url: targetUrl\n        },\n        { cors: false }\n      );\n      return;\n    }\n\n    let rpc;\n    try {\n      rpc = await readJsonBody(req);\n    } catch (err) {\n      sendJson(\n        req,\n        res,\n        400,\n        {\n          jsonrpc: '2.0',\n          id: null,\n          error: { code: -32700, message: err.message }\n        },\n        { cors: false }\n      );\n      return;\n    }\n\n    if (!rpc || rpc.jsonrpc !== '2.0' || typeof rpc.method !== 'string') {\n      sendJson(\n        req,\n        res,\n        400,\n        {\n          jsonrpc: '2.0',\n          id: rpc && 'id' in rpc ? rpc.id : null,\n enyOrigin(originInput) {\n    if (originInput === '*') {\n      data.openOriginMode = { enabled: false, expiresAt: null };\n      save();\n      return { openOriginMode: { ...data.openOriginMode }, allowedOrigins: [...data.allowedOrigins] };\n    }\n    let origin = originInput;\n    try {\n      origin = new URL(originInput).origin;\n    } catch {\n      // keep raw\n    }\n    data.allowedOrigins = data.allowedOrigins.filter((o) =\u003e o !== origin);\n    save();\n    return { openOriginMode: { ...data.openOriginMode }, allowedOrigins: [...data.allowedOrigins] };\n  }\n\n  function isV1OriginAllowed(originHeader, selfOrigins = []) {\n    if (!originHeader) return true; // Local CLI / non-browser request\n    if (selfOrigins.includes(originHeader)) return true;\n    try {\n      const parsed = new URL(originHeader);\n      if (\n        parsed.hostname === 'localhost' ||\n        parsed.hostname === '127.0.0.1' ||\n        parsed.hostname === '[::1]'\n      ) {\n        return true;\n      }\n    } catch {\n      return false;\n    }\n    if (data.allowedOrigins.includes(originHeader)) return true;\n    if (isOpenOriginActive()) return true;\n    return false;\n  }\n\n  function setAllowedTools(specs = []) {\n    const validated = specs.map((s) =\u003e validateAllowToolSpec(s).full);\n    data.allowedTools = Array.from(new Set(validated));\n    save();\n    return [...data.allowedTools];\n  }\n\n  function getAllowedTools() {\n    return [...data.allowedTools];\n  }\n\n  function getWarnings() {\n    const warnings = [];\n    if (isOpenOriginActive()) {\n      const exp = data.openOriginMode.expiresAt\n        ? ` (expires at ${new Date(data.openOriginMode.expiresAt).toISOString()})`\n        : ' (no expiration set)';\n      warnings.push(\n        `WARNING: Open-origin mode (\"*\") is ACTIVE on /v1${exp}. Any website can send pure-chat prompts to your local model. Tools are disabled on /v1 while active.`\n      );\n    }\n    return warnings;\n  }\n\n  function g keTempEnv","line":11,"hits":3},{"name":"cleanup","line":41,"hits":3},{"name":"execCli","line":47,"hits":12},{"name":"write","line":53,"hits":25},{"name":"anonymous_5","line":80,"hits":1},{"name":"anonymous_6","line":101,"hits":1},{"name":"anonymous_7","line":102,"hits":1},{"name":"openBrowser","line":111,"hits":3},{"name":"anonymous_9","line":114,"hits":1},{"name":"anonymous_10","line":140,"hits":1},{"name":"anonymous_11","line":156,"hits":1},{"name":"fetch.method","line":166,"hits":1},{"name":"anonymous_13","line":178,"hits":3},{"name":"anonymous_15","line":194,"hits":1},{"name":"anonymous_16","line":236,"hits":1},{"name":"anonymous_17","line":241,"hits":1},{"name":"anonymous_18","line":243,"hits":1},{"name":"anonymous_19","line":275,"hits":1},{"name":"anonymous_20","line":328,"hits":2},{"name":"anonymous_21","line":337,"hits":1},{"name":"anonymous_22","line":354,"hits":2}],"sourceCode":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { Readable, Writable } from 'node:stream';\nimport { createStore } from '../src/store.mjs';\nimport { createRelayServer } from '../src/relay.mjs';\nimport { runCli } from '../src/cli.mjs';\n\nfunction makeTempEnv() {\n  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-cli-test-'));\n  const homeDir = path.join(root, 'home');\n  const configDir = path.join(root, 'config');\n  const binDir = path.join(root, 'bin');\n  const claudeLog = path.join(root, 'claude-calls.log');\n\n  fs.mkdirSync(homeDir, { recursive: true });\n  fs.mkdirSync(configDir, { recursive: true });\n  fs.mkdirSync(binDir, { recursive: true });\n\n  // Create fake `claude` binary that records all arguments to claude-calls.log\n  const fakeClaudePath = path.join(binDir, 'claude');\n  fs.writeFileSync(\n    fakeClaudePath,\n    `#!${process.execPath}\nconst fs = require('node:fs');\nfs.appendFileSync(${JSON.stringify(claudeLog)}, JSON.stringify(process.argv.slice(2)) + '\\\\n');\nprocess.stdout.write('fake-claude-ok\\\\n');\n`,\n    { mode: 0o755 }\n  );\n\n  return {\n    root,\n    homeDir,\n    configDir,\n    binDir,\n    fakeClaudePath,\n    claudeLog,\n    cleanup() {\n      fs.rmSync(root, { recursive: true, force: true });\n    }\n  };\n}\n\nasync function execCli(args, envObj, { stdinText = '' } = {}) {\n  let stdout = '';\n  let stderr = '';\n\n  const stdin = Readable.from(stdinText ? [stdinText] : []);\n  const stdoutStream = new Writable({\n    write(chunk, _enc, cb) {\n      stdout += chunk.toString();\n      cb();\n    }\n  });\n  const stderrStream = new Writable({\n    write(chunk, _enc, cb) {\n      stderr += chunk.toString();\n      cb();\n    }\n  });\n\n  const code = await runCli(args, {\n    env: {\n      HOME: envObj.homeDir,\n      AI_PROXY_HOME: envObj.configDir,\n      AI_PROXY_CLAUDE_BIN: envObj.fakeClaudePath,\n      AI_PROXY_NO_BROWSER: '1'\n    },\n    stdin,\n    stdout: stdoutStream,\n    stderr: stderrStream\n  });\n\n  return { code, stdout, stderr };\n}\n\ntest('/v1 enforces Origin allowlist, per-tool readOnlyHint filtering (Rule 4), and pure-chat wildcard mode with TTL (Rule 7)', async (t) =\u003e {\n  const env = makeTempEnv();\n  const store = createStore({ configDir: env.configDir });\n\n  // Register a site with one read-only tool and one mutating tool\n  const siteUrl = 'https://example.github.io/docs/mcp.html';\n  store.addSite({ url: siteUrl, name: 'docs-site' });\n  store.updateSiteTools(siteUrl, [\n    {\n      name: 'read_spec',\n      description: 'Read specification',\n      annotations: { readOnlyHint: true }\n    },\n    {\n      name: 'delete_site',\n      description: 'Delete site',\n      annotations: { readOnlyHint: false }\n    }\n  ]);\n\n  // Rule 4: Wildcards or whole-server specs in --allow-tool must throw\n  assert.throws(() =\u003e store.setAllowedTools(['mcp__docs-site__*']), /wildcards are forbidden/i);\n  assert.throws(() =\u003e store.setAllowedTools(['mcp__docs-site']), /must match mcp__\u003cserver\u003e__\u003ctool\u003e/i);\n\n  // Even if the user names BOTH read_spec and delete_site via --allow-tool,\n  // /v1 must ONLY expose read_spec because delete_site has readOnlyHint: false!\n  store.setAllowedTools(['mcp__docs-site__read_spec', 'mcp__docs-site__delete_site']);\n\n  const relay = createRelayServer({\n    store,\n    port: 0,\n    openBrowser: async () =\u003e {}\n  });\n  const { port } = await relay.start();\n  t.after(async () =\u003e {\n    await relay.stop();\n    env.cleanup();\n  });\n\n  // 1. Unauthorized Origin is rejected with 403 + CORS headers\n  const unauthRes = await fetch(`http://127.0.0.1:${port}/v1/chat/completions`, {\n    method: 'POST',\n    headers: {\n      Origin: 'https://untrusted.example.com',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ messages: [{ role: 'user', content: 'hi' }] })\n  });\n  assert.equal(unauthRes.status, 403);\n  assert.equal(unauthRes.headers.get('access-control-allow-origin'), 'https://untrusted.example.com');\n\n  // 2. Explicitly allow https://example.github.io -\u003e only read_spec is permitted, delete_site is blocked!\n  store.allowOrigin('https://example.github.io');\n  const authRes = await fetch(`http://127.0.0.1:${port}/v1/chat/completions`, {\n    method: 'POST',\n    headers: {\n      Origin: 'https://example.github.io',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ messages: [{ role: 'user', content: 'Explain spec' }] })\n  }).then((r) =\u003e r.json());\n\n  assert.deepEqual(authRes.ai_proxy.permittedReadOnlyTools, ['mcp__docs-site__read_spec']);\n  assert.equal(authRes.ai_proxy.openOriginMode, false);\n\n  // 3. Rule 7: Enable open-origin mode (*) with short TTL -\u003e pure chat (ZERO tools!) and loud warnings\n  store.allowOrigin('*', { ttlSeconds: 0.15 });\n  assert.equal(store.getWarnings().length, 1);\n\n  const wildcardRes = await fetch(`http://127.0.0.1:${port}/v1/chat/completions`, {\n    method: 'POST',\n    headers: {\n      Origin: 'https://any-random-site.example.org',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ messages: [{ role: 'user', content: 'Hello' }] })\n  }).then((r) =\u003e r.json());\n\n  assert.equal(wildcardRes.ai_proxy.openOriginMode, true);\n  assert.deepEqual(\n    wildcardRes.ai_proxy.permittedReadOnlyTools,\n    [],\n    'Open-origin (*) mode must strictly expose 0 tools'\n  );\n\n  // Wait for TTL to expire -\u003e random origin is rejected again (403)\n  await new Promise((r) =\u003e setTimeout(r, 200));\n  const expiredRes = await fetch(`http://127.0.0.1:${port}/v1/chat/completions`, {\n    method: 'POST',\n    headers: {\n      Origin: 'https://any-random-site.example.org',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ messages: [{ role: 'user', content: 'Hello again' }] })\n  });\n  assert.equal(expiredRes.status, 403);\n});\n\ntest('/admin/v1 enforces separate adminKey, origin-locked rate-limited open-dashboard without leaking key (Rule 5)', async (t) =\u003e {\n  const env = makeTempEnv();\n  const store = createStore({ configDir: env.configDir });\n  const pageKey = store.getOrCreatePageKey('https://example.github.io/docs/mcp.html');\n  const adminKey = store.getAdminKey();\n\n  const openedUrls = [];\n  const relay = createRelayServer({\n    store,\n    port: 0,\n    dashboardOrigins: ['https://example.github.io'],\n    openBrowser: async (u) =\u003e {\n      openedUrls.push(u);\n    }\n  });\n  const { port } = await relay.start();\n  t.after(async () =\u003e {\n    await relay.stop();\n    env.cleanup();\n  });\n\n  // 1. Per-page mcp-key CANNOT access /admin/v1/status (401)\n  const pageKeyAdminAttempt = await fetch(`http://127.0.0.1:${port}/admin/v1/status`, {\n    headers: { Authorization: `Bearer ${pageKey}` }\n  });\n  assert.equal(pageKeyAdminAttempt.status, 401);\n\n  // 2. open-dashboard rejects non-dashboard O
