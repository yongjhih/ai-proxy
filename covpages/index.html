,"274":{"hits":1},"275":{"hits":1},"276":{"hits":1},"277":{"hits":1},"278":{"hits":1},"279":{"hits":1},"280":{"hits":1},"281":{"hits":1},"282":{"hits":1},"283":{"hits":1}},"functionDetails":[{"name":"runScript","line":13,"hits":1},{"name":"anonymous_1","line":14,"hits":1},{"name":"anonymous_2","line":15,"hits":1},{"name":"anonymous_3","line":27,"hits":1},{"name":"anonymous_4","line":41,"hits":1},{"name":"execCli","line":63,"hits":3},{"name":"write","line":74,"hits":5},{"name":"anonymous_8","line":121,"hits":2},{"name":"anonymous_9","line":132,"hits":1},{"name":"anonymous_12","line":228,"hits":4}],"sourceCode":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { execFile } from 'node:child_process';\nimport { Readable, Writable } from 'node:stream';\nimport { runCli } from '../src/cli.mjs';\nimport { buildDockerWrapperPlan, runDockerWrapper } from '../src/docker.mjs';\n\nconst ROOT_DIR = path.resolve(import.meta.dirname, '..');\n\nfunction runScript(binPath, args, env) {\n  return new Promise((resolve, reject) =\u003e {\n    execFile(binPath, args, { env: { ...process.env, ...env } }, (err, stdout, stderr) =\u003e {\n      if (err) {\n        err.stdout = stdout;\n        err.stderr = stderr;\n        reject(err);\n        return;\n      }\n      resolve({ stdout, stderr });\n    });\n  });\n}\n\ntest('.devcontainer configuration files exist and configure host.docker.internal and port 8788', () =\u003e {\n  const devcontainerJson = JSON.parse(\n    fs.readFileSync(path.join(ROOT_DIR, '.devcontainer', 'devcontainer.json'), 'utf8')\n  );\n  assert.ok(devcontainerJson.forwardPorts.includes(8788));\n  assert.ok(devcontainerJson.runArgs.includes('--add-host=host.docker.internal:host-gateway'));\n  assert.equal(devcontainerJson.containerEnv.AI_PROXY_HOST, 'host.docker.internal');\n  assert.equal(devcontainerJson.containerEnv.AI_PROXY_PORT, '8788');\n  assert.equal(devcontainerJson.containerEnv.AI_PROXY_URL, 'http://host.docker.internal:8788');\n  assert.ok(fs.existsSync(path.join(ROOT_DIR, '.devcontainer', 'Dockerfile')));\n  assert.ok(fs.existsSync(path.join(ROOT_DIR, '.devcontainer', 'post-create.sh')));\n  assert.ok(fs.existsSync(path.join(ROOT_DIR, 'Dockerfile')));\n});\n\ntest('ai-proxy devcontainer init creates/merges .devcontainer/devcontainer.json and up/exec wraps devcontainer CLI', async () =\u003e {\n  const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-devc-'));\n  const fakeBinDir = path.join(tmpDir, 'bin');\n  const devcLogPath = path.join(tmpDir, 'devcontainer.log');\n  fs.mkdirSync(fakeBinDir, { recursive: true });\n\n  const fakeDevcontainerBin = path.join(fakeBinDir, 'fake-devcontainer');\n  fs.writeFileSync(\n    fakeDevcontainerBin,\n    `#!/usr/bin/env node\\nimport fs from 'node:fs';\\nfs.appendFileSync(${JSON.stringify(\n      devcLogPath\n    )}, JSON.stringify(process.argv.slice(2)) + '\\\\n');\\n`,\n    { mode: 0o755 }\n  );\n\n  const projectDir = path.join(tmpDir, 'my-project');\n  fs.mkdirSync(path.join(projectDir, '.devcontainer'), { recursive: true });\n  fs.writeFileSync(\n    path.join(projectDir, '.devcontainer', 'devcontainer.json'),\n    JSON.stringify({ name: 'Existing Project', forwardPorts: [3000] }, null, 2)\n  );\n\n  async function execCli(args) {\n    let out = '';\n    let err = '';\n    const code = await runCli(args, {\n      env: {\n        ...process.env,\n        AI_PROXY_HOME: path.join(tmpDir, 'config'),\n        AI_PROXY_DEVCONTAINER_BIN: fakeDevcontainerBin\n      },\n      stdin: Readable.from([]),\n      stdout: new Writable({\n        write(c, _e, cb) {\n          out += c.toString();\n          cb();\n        }\n      }),\n      stderr: new Writable({\n        write(c, _e, cb) {\n          err += c.toString();\n          cb();\n        }\n      })\n    });\n    return { code, out, err };\n  }\n\n  try {\n    const initRes = await execCli(['devcontainer', 'init', '--dir', projectDir, '--port', '8799']);\n    assert.equal(initRes.code, 0, initRes.err);\n    const parsedOut = JSON.parse(initRes.out);\n    assert.equal(parsedOut.ok, true);\n\n    const merged = JSON.parse(\n      fs.readFileSync(path.join(projectDir, '.devcontainer', 'devcontainer.json'), 'utf8')\n    );\n    assert.equal(merged.name, 'Existing Project');\n    assert.deepEqual(merged.forwardPorts, [3000, 8799]);\n    assert.ok(merged.runArgs.includes('--add-host=host.docker.internal:host-gateway'));\n    assert.equal(merged.containerEnv.AI_PROXY_URL, 'http://host.docker.internal:8799');\n\n    const upRes = await execCli(['devcontainer', 'up', '--dir', projectDir, '--port', '8799']);\n    assert.equal(upRes.code, 0);\n\n    const execRes = await execCli([\n      'devcontainer',\n      'exec',\n      '--dir',\n      projectDir,\n      '--port',\n      '8799',\n      'claude'\n    ]);\n    assert.equal(execRes.code, 0);\n\n    const logLines = fs\n      .readFileSync(devcLogPath, 'utf8')\n      .trim()\n      .split('\\n')\n      .map((l) =\u003e JSON.parse(l));\n    assert.equal(logLines.length, 2);\n    assert.equal(logLines[0][0], 'up');\n    assert.ok(logLines[0].includes('AI_PROXY_URL=http://host.docker.internal:8799'));\n    assert.equal(logLines[1][0], 'exec');\n    assert.equal(logLines[1][logLines[1].length - 1], 'claude');\n  } finally {\n    fs.rmSync(tmpDir, { recursive: true, force: true });\n  }\n});\n\ntest('docker-wrapper CLI (bin/ai-proxy-docker.mjs, bin/ai-proxy-docker, ai-proxy docker) handles containerized ai-proxy and wrapped docker run', async () =\u003e {\n  const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-docker-test-'));\n  const dockerLogPath = path.join(tmpDir, 'docker.log');\n  const fakeDockerBin = path.join(tmpDir, 'fake-docker');\n\n  // Fake docker binary: returns exit code 1 on `image inspect` the first time to trigger `docker build`, then logs all calls\n  const inspectMarker = path.join(tmpDir, 'image-built');\n  fs.writeFileSync(\n    fakeDockerBin,\n    `#!/usr/bin/env node\nimport fs from 'node:fs';\nconst args = process.argv.slice(2);\nfs.appendFileSync(${JSON.stringify(dockerLogPath)}, JSON.stringify(args) + '\\\\n');\nif (args[0] === 'image' && args[1] === 'inspect') {\n  if (!fs.existsSync(${JSON.stringify(inspectMarker)})) {\n    process.exit(1);\n  }\n  process.exit(0);\n}\nif (args[0] === 'build') {\n  fs.writeFileSync(${JSON.stringify(inspectMarker)}, '1');\n  process.exit(0);\n}\nprocess.exit(0);\n`,\n    { mode: 0o755 }\n  );\n\n  try {\n    // 1. Unit check buildDockerWrapperPlan for `serve`, `mcp`, and `run`\n    const servePlan = buildDockerWrapperPlan(['serve', '--port', '9123'], {\n      env: { AI_PROXY_HOME: path.join(tmpDir, 'cfg') },\n      cwd: tmpDir\n    });\n    assert.equal(servePlan.mode, 'containerized-ai-proxy');\n    assert.equal(servePlan.port, 9123);\n    assert.ok(servePlan.dockerArgs.includes('127.0.0.1:9123:8788'));\n    assert.ok(servePlan.dockerArgs.includes('--add-host=host.docker.internal:host-gateway'));\n\n    const mcpPlan = buildDockerWrapperPlan(['mcp', '--url', 'https://example.github.io/docs/mcp.html'], {\n      env: { AI_PROXY_HOME: path.join(tmpDir, 'cfg') },\n      cwd: tmpDir\n    });\n    assert.equal(mcpPlan.mode, 'containerized-ai-proxy');\n    assert.ok(mcpPlan.dockerArgs.includes('host.docker.internal'));\n\n    const wrapRunPlan = buildDockerWrapperPlan(['run', '-it', 'my-agent:latest', 'claude'], {\n      env: { AI_PROXY_HOME: path.join(tmpDir, 'cfg'), AI_PROXY_PORT: '8788' },\n      cwd: tmpDir\n    });\n    assert.equal(wrapRunPlan.mode, 'wrap-docker-run');\n    assert.ok(wrapRunPlan.dockerArgs.includes('--add-host=host.docker.internal:host-gateway'));\n    assert.ok(wrapRunPlan.dockerArgs.includes('AI_PROXY_HOST=host.docker.internal'));\n    assert.ok(wrapRunPlan.dockerArgs.includes('AI_PROXY_URL=http://host.docker.internal:8788'));\n    assert.equal(wrapRunPlan.dockerArgs[wrapRunPlan.dockerArgs.length - 1], 'claude');\n\n    // 2. Execute via `ai-proxy docker-wrapper` and `bin/ai-proxy-docker.mjs` using fake docker binary\n    let stdoutStr = '';\n    let stderrStr = '';\n    const exitCode = await runDockerWrapper(['serve', '--port', '8899'], {\n      env: {\n        ...process.env,\n        AI_PROXY_DOCKER_BIN: fakeDockerBin,\n        AI_PROXY_HOME: path.join(tmpDir, 'cfg')\n      },\n      cwd: tmpDir,\n      stdout: new Writable({\n        write(c, _e, cb) {\n          stdoutStr += c.toString();\n          cb();\n        }\n      }),\n      stderr: new Writable({\n        write(c, _e, cb) {\n          stderrStr += c.toString();\n          cb();\n        }\n      })\n    });\n    assert.equal(exitCode, 0);\n\n    // Execute `bin/ai-proxy-docker` shell script for `run` mode\n    await runScript(\n      path.join(ROOT_DIR, 'bin', 'ai-proxy-docker'),\n      ['run', 'ubuntu:24.04', 'echo', 'hello'],\n      {\n        AI_PROXY_DOCKER_BIN: fakeDockerBin,\n        AI_PROXY_HOME: path.join(tmpDir, 'cfg'),\n        AI_PROXY_PORT: '8899'\n      }\n    );\n\n    const calls = fs\n      .readFileSync(dockerLogPath, 'utf8')\n      .trim()\n      .split('\\n')\n      .map((l) =\u003e JSON.parse(l));\n    // Call 1: image inspect -\u003e failed -\u003e Call 2: build -\u003e Call 3: run serve -\u003e Call 4: run ubuntu:24.04\n    assert.equal(calls.length, 4);\n    assert.deepEqual(calls[0].slice(0, 2), ['image', 'inspect']);\n    assert.equal(calls[1][0], 'build');\n    assert.equal(calls[2][0], 'run');\n    assert.ok(calls[2].includes('127.0.0.1:8899:8788'));\n    assert.equal(calls[3][0], 'run');\n    assert.ok(calls[3].includes('AI_PROXY_URL=http://host.docker.internal:8899'));\n\n    // 3. Verify `ai-proxy add` inside a container with AI_PROXY_HOST=host.docker.internal registers host.docker.internal URL\n    const claudeLog = path.join(tmpDir, 'claude.log');\n    const fakeClaude = path.join(tmpDir, 'fake-claude');\n    fs.writeFileSync(\n      fakeClaude,\n      `#!/usr/bin/env node\\nimport fs from 'node:fs';\\nfs.appendFileSync(${JSON.stringify(\n        claudeLog\n      )}, JSON.stringify(process.argv.slice(2)) + '\\\\n');\\n`,\n      { mode: 0o755 }\n    );\n\n    let addOut = '';\n    const addCode = await runCli(\n      ['add', 'https://example.github.io/docs/mcp.html', '--name', 'docs'],\n      {\n        env: {\n          ...process.env,\n          AI_PROXY_HOME: path.join(tmpDir, 'cfg'),\n          AI_PROXY_HOST: 'host.docker.internal',\n          AI_PROXY_PORT: '8788',\n          AI_PROXY_CLAUDE_BIN: fakeClaude\n        },\n        stdin: Readable.from([]),\n        stdout: new Writable({\n          write(c, _e, cb) {\n            addOut += c.toString();\n            cb();\n          }\n        }),\n        stderr: new Writable({\n          write(_c, _e, cb) {\n            cb();\n          }\n        })\n      }\n    );\n    assert.equal(addCode, 0);\n    const parsedAdd = JSON.parse(addOut);\n    assert.equal(\n      parsedAdd.mcpEndpoint,\n      'http://host.docker.internal:8788/mcp?url=https%3A%2F%2Fexample.github.io%2Fdocs%2Fmcp.html'\n    );\n  } finally {\n    fs.rmSync(tmpDir, { recursive: true, force: true });\n  }\n});\n"},"test/i18n.test.mjs":{"path":"test/i18n.test.mjs","lines":{"total":53,"covered":53,"skipped":0,"pct":100},"functions":{"total":1,"covered":1,"skipped":0,"pct":100},"branches":{"total":4,"covered":4,"skipped":0,"pct":100},"lineDetails":{"1":{"hits":1,"branches":{"total":1,"taken":1}},"2":{"hits":1},"3":{"hits":1},"4":{"hits":1},"5":{"hits":1},"6":{"hits":1},"7":{"hits":1},"8":{"hits":1},"9":{"hits":1},"10":{"hits":1},"11":{"hits":1,"branches":{"total":1,"taken":1}},"12":{"hits":1},"13":{"hits":1},"14":{"hits":1},"15":{"hits":1},"16":{"hits":1},"17":{"hits":1},"18":{"hits":1},"19":{"hits":1},"20":{"hits":1},"21":{"hits":1},"22":{"hits":1},"23":{"hits":1},"24":{"hits":1},"25":{"hits":1},"26":{"hits":1},"27":{"hits":1},"28":{"hits":1},"29":{"hits":1},"30":{"hits":1},"31":{"hits":1},"32":{"hits":1},"33" me":"anonymous_24","line":283,"hits":1}],"sourceCode":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { createRelayServer } from '../src/relay.mjs';\nimport { createStore } from '../src/store.mjs';\nimport { createModelContext } from '../web/model-context.mjs';\nimport { createTabClient } from '../web/client.mjs';\n\nfunction makeTempConfigDir() {\n  return fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-test-'));\n}\n\ntest('Relay end-to-end with fake tab: multi-client ID rewriting, idle wake-up, and /mcp path & query routes', async (t) =\u003e {\n  const configDir = makeTempConfigDir();\n  const store = createStore({ configDir });\n  const pageUrl = 'https://example.github.io/docs/mcp.html';\n  store.allowPrefix('https://example.github.io/docs/');\n  const pageKey = store.getOrCreatePageKey(pageUrl);\n\n  const relay = createRelayServer({\n    store,\n    port: 0,\n    pollTimeoutMs: 2000,\n    reconnectGraceMs: 50,\n    connectTimeoutMs: 1000,\n    execTimeoutMs: 1000\n  });\n  const { port } = await relay.start();\n  t.after(async () =\u003e {\n    await relay.stop();\n    fs.rmSync(configDir, { recursive: true, force: true });\n  });\n\n  // Set up fake browser tab with ModelContext\n  const mc = createModelContext();\n  const seenRpcIdsInTab = [];\n  mc.registerTool({\n    name: 'slow_echo',\n    description: 'Echoes input after delay',\n    inputSchema: {\n      type: 'object',\n      properties: {\n        clientName: { type: 'string' },\n        delayMs: { type: 'integer' }\n      },\n      required: ['clientName', 'delayMs']\n    },\n    annotations: { readOnlyHint: true },\n    async execute({ clientName, delayMs }) {\n      await new Promise((r) =\u003e setTimeout(r, delayMs));\n      return { echoedFor: clientName };\n    }\n  });\n\n  // Intercept tab fetches to record the rewritten JSON-RPC IDs sent by relay\n  const wrappedFetch = async (url, init) =\u003e {\n    const res = await fetch(url, init);\n    if (String(url).includes('/tab/v1/poll') && res.status === 200) {\n      const cloned = res.clone();\n      const body = await cloned.json();\n      if (body && body.rpc) {\n        seenRpcIdsInTab.push(body.rpc.id);\n      }\n    }\n    return res;\n  };\n\n  const tabClient = createTabClient({\n    url: pageUrl,\n    title: 'Docs Tab',\n    mcpKey: pageKey,\n    mcpPort: port,\n    modelContext: mc,\n    fetchImpl: wrappedFetch\n  });\n\n  await tabClient.start();\n  t.after(() =\u003e tabClient.stop());\n\n  // Wait briefly so the tab is parked in idle long-polling\n  await new Promise((r) =\u003e setTimeout(r, 40));\n\n  // Two MCP clients send concurrent requests with the EXACT SAME JSON-RPC id: 1\n  const clientA = fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(pageUrl)}`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      jsonrpc: '2.0',\n      id: 1,\n      method: 'tools/call',\n      params: { name: 'slow_echo', arguments: { clientName: 'ClientA', delayMs: 40 } }\n    })\n  }).then((r) =\u003e r.json());\n\n  const clientB = fetch(`http://127.0.0.1:${port}/mcp/example.github.io/docs/mcp.html`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      jsonrpc: '2.0',\n      id: 1,\n      method: 'tools/call',\n      params: { name: 'slow_echo', arguments: { clientName: 'ClientB', delayMs: 10 } }\n    })\n  }).then((r) =\u003e r.json());\n\n  const [resA, resB] = await Promise.all([clientA, clientB]);\n\n  // Both clients receive their own original id: 1 and their own payload!\n  assert.equal(resA.id, 1);\n  assert.equal(resB.id, 1);\n  assert.deepEqual(JSON.parse(resA.result.content[0].text), { echoedFor: 'ClientA' });\n  assert.deepEqual(JSON.parse(resB.result.content[0].text), { echoedFor: 'ClientB' });\n\n  // Inside the tab, the two JSON-RPC ids were rewritten to distinct callIds\n  assert.equal(seenRpcIdsInTab.length, 2);\n  assert.notEqual(seenRpcIdsInTab[0], seenRpcIdsInTab[1]);\n  assert.notEqual(seenRpcIdsInTab[0], 1);\n});\n\ntest('Relay reconnect grace period and 409 Conflict re-hello recovery without opening duplicate tab', async (t) =\u003e {\n  const configDir = makeTempConfigDir();\n  const store = createStore({ configDir });\n  const pageUrl = 'https://example.github.io/app/mcp.html';\n  store.allowPrefix('https://example.github.io/app/');\n  const pageKey = store.getOrCreatePageKey(pageUrl);\n\n  let browserOpenCount = 0;\n  const relay = createRelayServer({\n    store,\n    port: 0,\n    pollTimeoutMs: 1000,\n    reconnectGraceMs: 250,\n    connectTimeoutMs: 1000,\n    execTimeoutMs: 1000,\n    openBrowser: async () =\u003e {\n      browserOpenCount += 1;\n    }\n  });\n  const { port } = await relay.start();\n  t.after(async () =\u003e {\n    await relay.stop();\n    fs.rmSync(configDir, { recursive: true, force: true });\n  });\n\n  // 1. Verify stale sessionId receives 409 Conflict with CORS headers\n  const stalePoll = await fetch(`http://127.0.0.1:${port}/tab/v1/poll?sessionId=ses_stale_old`, {\n    method: 'GET',\n    headers: {\n      Authorization: `Bearer ${pageKey}`,\n      Origin: 'https://example.github.io'\n    }\n  });\n  assert.equal(stalePoll.status, 409);\n  assert.equal(stalePoll.headers.get('access-control-allow-origin'), 'https://example.github.io');\n\n  // 2. Start an MCP request BEFORE the tab connects; tab connects 60ms later (within 250ms grace window)\n  const mc = createModelContext();\n  mc.registerTool({\n    name: 'ping_app',\n    description: 'Returns pong',\n    annotations: { readOnlyHint: true },\n    async execute() {\n      return { pong: true };\n    }\n  });\n\n  const tabClient = createTabClient({\n    url: pageUrl,\n    title: 'App Tab',\n    mcpKey: pageKey,\n    mcpPort: port,\n    modelContext: mc\n  });\n  t.after(() =\u003e tabClient.stop());\n\n  const mcpCallPromise = fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(pageUrl)}`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      jsonrpc: '2.0',\n      id: 99,\n      method: 'tools/call',\n      params: { name: 'ping_app', arguments: {} }\n    })\n  }).then((r) =\u003e r.json());\n\n  setTimeout(() =\u003e {\n    tabClient.start();\n  }, 60);\n\n  const mcpReply = await mcpCallPromise;\n  assert.equal(mcpReply.id, 99);\n  assert.deepEqual(JSON.parse(mcpReply.result.content[0].text), { pong: true });\n  assert.equal(browserOpenCount, 0, 'Should NOT have opened a new browser tab when existing tab reconnected within grace period');\n});\n\ntest('Relay enforces queue limit (-32000) and call timeout (-32001)', async (t) =\u003e {\n  const configDir = makeTempConfigDir();\n  const store = createStore({ configDir });\n  const pageUrl = 'https://example.github.io/timeout-app/mcp.html';\n  store.allowPrefix('https://example.github.io/timeout-app/');\n\n  const relay = createRelayServer({\n    store,\n    port: 0,\n    maxQueueSize: 2,\n    reconnectGraceMs: 30,\n    connectTimeoutMs: 120,\n    execTimeoutMs: 120,\n    openBrowser: async () =\u003e {}\n  });\n  const { port } = await relay.start();\n  t.after(async () =\u003e {\n    await relay.stop();\n    fs.rmSync(configDir, { recursive: true, force: true });\n  });\n\n  const sendCall = (id) =\u003e\n    fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(pageUrl)}`, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({\n        jsonrpc: '2.0',\n        id,\n        method: 'tools/list',\n        params: {}\n      })\n    }).then((r) =\u003e r.json());\n\n  // Fire 3 concurrent calls when maxQueueSize is 2 and no tab connects\n  const [r1, r2, r3] = await Promise.all([sendCall(1), sendCall(2), sendCall(3)]);\n\n  // The 3rd call must be rejected immediately with queue full (-32000)\n  assert.equal(r3.id, 3);\n  assert.equal(r3.error.code, -32000);\n  assert.match(r3.error.message, /queue full/i);\n\n  // The first 2 calls time out waiting for tab (-32001)\n  assert.equal(r1.error.code, -32001);\n  assert.equal(r2.error.code, -32001);\n});\n\ntest('Relay enforces all security rejection paths, Claude Code quirks, and CORS / LNA headers', async (t) =\u003e {\n  const configDir = makeTempConfigDir();\n  const store = createStore({ configDir });\n  const goodUrl = 'https://example.github.io/good-repo/mcp.html';\n  const evilSiblingUrl = 'https://example.github.io/good-repo-evil/mcp.html';\n  store.allowPrefix('https://example.github.io/good-repo');\n  const goodKey = store.getOrCreatePageKey(goodUrl);\n\n  const relay = createRelayServer({ store, port: 0 });\n  const { port } = await relay.start();\n  t.after(async () =\u003e {\n    await relay.stop();\n    fs.rmSync(configDir, { recursive: true, force: true });\n  });\n\n  // 1. Rule 3: /mcp rejects any request carrying an Origin header (403)\n  const originMcpRes = await fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(goodUrl)}`, {\n    method: 'POST',\n    headers: {\n      Origin: 'https://example.github.io',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'ping' })\n  });\n  assert.equal(originMcpRes.status, 403);\n\n  // 2. Claude Code GET /mcp SSE probe -\u003e 405 Method Not Allowed\n  const getSseRes = await fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(goodUrl)}`, {\n    method: 'GET'\n  });\n  assert.equal(getSseRes.status, 405);\n  assert.equal(getSseRes.headers.get('allow'), 'POST');\n\n  // 3. Claude Code server/discover probe -\u003e -32601\n  const discoverRes = await fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(goodUrl)}`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ jsonrpc: '2.0', id: 10, method: 'server/discover', params: {} })\n  }).then((r) =\u003e r.json());\n  assert.equal(discoverRes.id, 10);\n  assert.equal(discoverRes.error.code, -32601);\n\n  // 4. Rule 2: Sibling repo on same origin rejected by path-boundary prefix allowlist (403)\n  const evilMcpRes = await fetch(`http://127.0.0.1:${port}/mcp?url=${encodeURIComponent(evilSiblingUrl)}`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'ping' })\n  });\n  assert.equal(evilMcpRes.status, 403);\n\n  // 5. Rule 1 & CORS on rejection: Wrong key on /tab/v1/hello returns 401 WITH CORS headers\n  const badKeyRes = await fetch(`http://127.0.0.1:${port}/tab/v1/hello`, {\n    method: 'POST',\n    headers: {\n      Origin: 'https://example.github.io',\n      Authorization: 'Bearer wrong_key',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ url: goodUrl, title: 'Test', tools: [] })\n  });\n  assert.equal(badKeyRes.status, 401);\n  assert.equal(badKeyRes.headers.get('access-control-allow-origin'), 'https://example.github.io');\n  assert.equal(badKeyRes.headers.get('access-control-allow-private-network'), 'true');\n\n  // 6. Cross-page key reuse blocked: goodKey cannot authenticate another localhost page\n  const crossPageRes = await fetch(`http://127.0.0.1:${port}/tab/v1/hello`, {\n    method: 'POST',\n    headers: {\n      Origin: 'http://localhost:3000',\n      Authorization: `Bearer ${goodKey}`,\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ url: 'http://localhost:3000/mcp.html', title: 'Other', tools: [] })\n  });\n  assert.equal(crossPageRes.status, 401);\n\n  // 7. Chrome Local Network Access OPTIONS preflight\n  const preflightRes = await fetch(`http://127.0.0.1:${port}/tab/v1/hello`, {\n    method: 'OPTIONS',\n    headers: {\n      Origin: 'https://example.github.io',\n      'Access-Control-Request-Method': 'POST',\n      'Access-Control-Request-Private-Network': 'true'\n    }\n  });\n  assert.equal(preflightRes.status, 204);\n  assert.equal(preflightRes.headers.get('access-control-allow-origin'), 'https://example.github.io');\n  assert.equal(preflightRes.headers.get('access-control-allow-private-network'), 'true');\n});\n"},"test/security-baselines.test.mjs":{"path":"test/security-baselines.test.mjs","lines":{"total":335,"covered":331,"skipped":4,"pct":98.81},"functions":{"total":18,"covered":16,"skipped":2,"pct":88.89},"branches":{"total":19,"covered":18,"skipped":1,"pct":94.74},"lineDetails":{"1":{"hits":1,"branches":{"total":1,"taken":1}},"2":{"hits":1},"3":{"hits":1},"4":{"hits":1},"5":{"hits":1},"6":{"hits":1},"7":{"hits":1},"8":{"hits":1},"9":{"hits":1},"10":{"hits":1},"11":{"hits":1},"12":{"hits":1},"13":{"hits":1},"14":{"hits":1,"branches":{"total":1,"taken":1}},"15":{"hits":1},"16":{"hits":1},"17":{"hits":1},"18":{"hits":1},"19":{"hits":1},"20":{"hits":1},"21":{"hits":1},"22":{"hits":1},"23":{"hits":1},"24":{"hits":1},"25":{"hits":1},"26":{"hits":1},"27":{"hits":1},"28":{"hits":1},"29":{"hits":1},"30":{"hits":1},"31":{"hits":1},"32":{"hits":1},"33":{"hits":1},"34":{"hits":1},"35":{"hits":1},"36":{"hits":1},"37":{"hits":1},"38":{"hits":1},"39":{"hits":1},"40":{"hits":1},"41":{"hits":1},"42":{"hits":1},"43":{"hits":1},"44":{"hits":1},"45":{"hits":1},"46":{"hits":1},"47":{"hits":1},"48":{"hits":1},"49":{"hits":1},"50":{"hits":1},"51":{"hits":1},"52":{"hits":1,"branches":{"total":1,"taken":1}},"53":{"hits":1},"54":{"hits":1},"55":{"hits":1},"56":{"hits":1},"57":{"hits":1},"58":{"hits":1},"59":{"hits":1},"60":{"hits":1},"61":{"hits":1},"62":{"hits":1,"branches":{"total":1,"taken":1}},"63":{"hits":1},"64":{"hits":1,"branches":{"total":1,"taken":0}},"65":{"hits":1},"66":{"hits":1},"67":{"hits":1},"68":{"hits":1},"69":{"hits":0},"70":{"hits":0},"71":{"hits":1},"72":{"hits":1},"73":{"hits":1},"74":{"hits":0},"75":{"hits":0},"76":{"hits":1},"77":{"hits":1},"78":{"hits":1},"79":{"hits":1},"80":{"hits":1},"81":{"hits":1},"82":{"hits":1},"83":{"hits": ":1},"299":{"hits":1},"300":{"hits":1},"301":{"hits":1},"302":{"hits":1,"branches":{"total":1,"taken":1}},"303":{"hits":1},"304":{"hits":1},"305":{"hits":1},"306":{"hits":1},"307":{"hits":1,"branches":{"total":1,"taken":1}},"308":{"hits":1},"309":{"hits":1},"310":{"hits":1},"311":{"hits":1},"312":{"hits":1},"313":{"hits":1,"branches":{"total":1,"taken":1}},"314":{"hits":1},"315":{"hits":1},"316":{"hits":1},"317":{"hits":1},"318":{"hits":1},"319":{"hits":1},"320":{"hits":1},"321":{"hits":1},"322":{"hits":1},"323":{"hits":1},"324":{"hits":1},"325":{"hits":1},"326":{"hits":1},"327":{"hits":1},"328":{"hits":1},"329":{"hits":1},"330":{"hits":1},"331":{"hits":1},"332":{"hits":1},"333":{"hits":1},"334":{"hits":1},"335":{"hits":1}},"functionDetails":[{"name":"anonymous_0","line":14,"hits":1},{"name":"anonymous_1","line":52,"hits":1},{"name":"replaceState","line":62,"hits":1},{"name":"setItem","line":68,"hits":0},{"name":"anonymous_5","line":112,"hits":1},{"name":"anonymous_6","line":136,"hits":1},{"name":"chatBackend","line":142,"hits":2},{"name":"anonymous_8","line":183,"hits":1},{"name":"anonymous_9","line":192,"hits":3},{"name":"openBrowser","line":198,"hits":3},{"name":"anonymous_11","line":240,"hits":1},{"name":"anonymous_12","line":252,"hits":1},{"name":"anonymous_14","line":280,"hits":1},{"name":"anonymous_15","line":302,"hits":1},{"name":"write","line":307,"hits":2}],"sourceCode":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { Readable, Writable } from 'node:stream';\nimport { createRelayServer } from '../src/relay.mjs';\nimport { runCli } from '../src/cli.mjs';\nimport { extractHandshake } from '../web/handshake.mjs';\nimport { matchesPrefix } from '../web/url.mjs';\n\nconst ROOT_DIR = path.resolve(import.meta.dirname, '..');\n\ntest('Security Baseline 1: Path-boundary URL prefix allowlist blocks sibling repos on shared Origin (\u003cuser\u003e.github.io)', async () =\u003e {\n  // Verify path-segment boundary matching\n  assert.equal(\n    matchesPrefix('https://example.github.io/docs/mcp.html', 'https://example.github.io/docs/'),\n    true\n  );\n  assert.equal(\n    matchesPrefix('https://example.github.io/docs-evil/mcp.html', 'https://example.github.io/docs/'),\n    false\n  );\n\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-sec1-'));\n  const relay = createRelayServer({ port: 0, homeDir: tmpHome });\n  const { port } = await relay.start();\n  try {\n    relay.store.allowPrefix('https://example.github.io/docs/');\n\n    // Sibling repo on the exact same Origin must be rejected with 403 Forbidden\n    const evilRes = await fetch(`http://127.0.0.1:${port}/tab/v1/hello`, {\n      method: 'POST',\n      headers: {\n        Origin: 'https://example.github.io',\n        'Content-Type': 'application/json',\n        Authorization: 'Bearer fake_key'\n      },\n      body: JSON.stringify({\n        url: 'https://example.github.io/docs-evil/mcp.html',\n        tools: []\n      })\n    });\n    assert.equal(evilRes.status, 403);\n    assert.equal(evilRes.headers.get('access-control-allow-origin'), 'https://example.github.io');\n  } finally {\n    await relay.stop();\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n\ntest('Security Baseline 2: Per-page key handoff moves #mcp-key into history.state, scrubs URL, and never touches storage', async () =\u003e {\n  let storageTouched = false;\n  const fakeWindow = {\n    location: {\n      pathname: '/repo/mcp.html',\n      search: '',\n      hash: '#mcp-key=mcp_secret123&mcp-port=8788'\n    },\n    history: {\n      state: null,\n      replaceState(nextState, _unused, cleanUrl) {\n        this.state = nextState;\n        fakeWindow.location.hash = cleanUrl.includes('#') ? `#${cleanUrl.split('#')[1]}` : '';\n      }\n    },\n    localStorage: {\n      setItem() {\n        storageTouched = true;\n      }\n    },\n    sessionStorage: {\n      setItem() {\n        storageTouched = true;\n      }\n    }\n  };\n\n  const hs = extractHandshake(fakeWindow);\n  assert.equal(hs.mcpKey, 'mcp_secret123');\n  assert.equal(fakeWindow.location.hash, '');\n  assert.equal(fakeWindow.history.state.__aiProxy.mcpKey, 'mcp_secret123');\n  assert.equal(storageTouched, false);\n\n  // Also verify per-page key isolation on the relay: Page A's key is rejected for Page B on the same Origin\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-sec2-'));\n  const relay = createRelayServer({ port: 0, homeDir: tmpHome });\n  const { port } = await relay.start();\n  try {\n    const siteA = relay.store.addSite({ url: 'https://example.github.io/a/mcp.html', name: 'a' });\n    relay.store.addSite({ url: 'https://example.github.io/b/mcp.html', name: 'b' });\n\n    const crossKeyRes = await fetch(`http://127.0.0.1:${port}/tab/v1/hello`, {\n      method: 'POST',\n      headers: {\n        Origin: 'https://example.github.io',\n        'Content-Type': 'application/json',\n        Authorization: `Bearer ${siteA.key}`\n      },\n      body: JSON.stringify({\n        url: 'https://example.github.io/b/mcp.html',\n        tools: []\n      })\n    });\n    assert.equal(crossKeyRes.status, 401);\n  } finally {\n    await relay.stop();\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n\ntest('Security Baseline 3: /mcp rejects any request carrying a browser Origin header with 403 Forbidden', async () =\u003e {\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-sec3-'));\n  const relay = createRelayServer({ port: 0, homeDir: tmpHome });\n  const { port } = await relay.start();\n  try {\n    const res = await fetch(\n      `http://127.0.0.1:${port}/mcp?url=${encodeURIComponent('http://127.0.0.1:3000/mcp.html')}`,\n      {\n        method: 'POST',\n        headers: {\n          Origin: 'https://evil.example',\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/list' })\n      }\n    );\n    assert.equal(res.status, 403);\n    assert.equal(res.headers.get('access-control-allow-origin'), 'https://evil.example');\n  } finally {\n    await relay.stop();\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n\ntest('Security Baseline 4: /v1 only exposes individually named --allow-tool mcp__\u003cserver\u003e__\u003ctool\u003e with readOnlyHint:true', async () =\u003e {\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-sec4-'));\n  let seenPermittedTools = [];\n  const relay = createRelayServer({\n    port: 0,\n    homeDir: tmpHome,\n    chatBackend: async ({ permittedTools }) =\u003e {\n      seenPermittedTools = permittedTools;\n      return 'ok';\n    }\n  });\n  const { port } = await relay.start();\n  try {\n    const siteUrl = 'https://example.github.io/notes/mcp.html';\n    relay.store.addSite({ url: siteUrl, name: 'notes' });\n    relay.store.updateSiteTools(siteUrl, [\n      {\n        name: 'read_note',\n        description: 'Read a note',\n        inputSchema: { type: 'object' },\n        annotations: { readOnlyHint: true }\n      },\n      {\n        name: 'delete_note',\n        description: 'Delete a note',\n        inputSchema: { type: 'object' },\n        annotations: { readOnlyHint: false }\n      }\n    ]);\n    relay.store.allowOrigin('https://example.github.io');\n\n    // Even if both tools are passed to setAllowedTools, only read_note (readOnlyHint: true) is permitted\n    relay.store.setAllowedTools(['mcp__notes__read_note', 'mcp__notes__delete_note']);\n\n    const res = await fetch(`http://127.0.0.1:${port}/v1/chat/completions`, {\n      method: 'POST',\n      headers: {\n        Origin: 'https://example.github.io',\n        'Content-Type': 'application/json'\n      },\n      body: JSON.stringify({\n        model: 'local-default',\n        messages: [{ role: 'user', content: 'hi' }]\n      })\n    });\n    assert.equal(res.status, 200);\n    assert.deepEqual(\n      seenPermittedTools.map((t) =\u003e t.fullSpec),\n      ['mcp__notes__read_note']\n    );\n  } finally {\n    await relay.stop();\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n\ntest('Security Baseline 5: /admin/v1 requires separate adminKey; open-dashboard checks Origin, rate-limits, and never returns key', async () =\u003e {\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-sec5-'));\n  const opened = [];\n  const relay = createRelayServer({\n    port: 0,\n    homeDir: tmpHome,\n    openBrowser: async (u) =\u003e opened.push(u)\n  });\n  const { port } = await relay.start();\n  try {\n    const site = relay.store.addSite({ url: 'https://example.github.io/a/mcp.html', name: 'a' });\n\n    // Page key cannot access /admin/v1/status\n    const withPageKey = await fetch(`http://127.0.0.1:${port}/admin/v1/status`, {\n      headers: { Authorization: `Bearer ${site.key}` }\n    });\n    assert.equal(withPageKey.status, 401);\n\n    // Foreign origin cannot call open-dashboard\n    const foreignOrigin = await fetch(`http://127.0.0.1:${port}/admin/v1/open-dashboard`, {\n      method: 'POST',\n      headers: { Origin: 'https://evil.example' }\n    });\n    assert.equal(foreignOrigin.status, 403);\n\n    // Legitimate dashboard origin triggers browser open, never leaks adminKey in body, and rate-limits after 3 calls\n    for (let i = 0; i \u003c 3; i += 1) {\n      const okOpen = await fetch(`http://127.0.0.1:${port}/admin/v1/open-dashboard`, {\n        method: 'POST',\n        headers: { Origin: `http://127.0.0.1:${port}` }\n      });\n      assert.equal(okOpen.status, 200);\n      const bodyText = await okOpen.text();\n      assert.ok(!bodyText.includes(relay.store.getAdminKey()), 'adminKey must never appear in HTTP response');\n    }\n    assert.equal(opened.length, 3);\n\n    const rateLimited = await fetch(`http://127.0.0.1:${port}/admin/v1/open-dashboard`, {\n      method: 'POST',\n      headers: { Origin: `http://127.0.0.1:${port}` }\n    });\n    assert.equal(rateLimited.status, 429);\n  } finally {\n    await relay.stop();\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n\ntest('Security Baseline 6: Mutating built-in MCP tools (add_site, remove_site) are marked readOnlyHint:false and document explicit user intent', () =\u003e {\n  const selfMcpSource = fs.readFileSync(path.join(ROOT_DIR, 'site', 'self-mcp.mjs'), 'utf8');\n  assert.ok(selfMcpSource.includes(\"name: 'add_site'\"));\n  assert.ok(selfMcpSource.includes(\"name: 'remove_site'\"));\n  assert.ok(\n    selfMcpSource.includes('Only call this tool when the human user has explicitly asked to add that specific site URL')\n  );\n  assert.ok(\n    selfMcpSource.includes('Only call this tool when the human user has explicitly asked to remove that specific site')\n  );\n});\n\ntest('Security Baseline 7: Wildcard (*) on /v1 forces zero tools (pure chat), enforces TTL, and emits warnings', async () =\u003e {\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-sec7-'));\n  let seenTools = ['unexpected'];\n  const relay = createRelayServer({\n    port: 0,\n    homeDir: tmpHome,\n    chatBackend: async ({ permittedTools }) =\u003e {\n      seenTools = permittedTools;\n      return 'pure chat response';\n    }\n  });\n  const { port } = await relay.start();\n  try {\n    const siteUrl = 'https://example.github.io/notes/mcp.html';\n    relay.store.addSite({ url: siteUrl, name: 'notes' });\n    relay.store.updateSiteTools(siteUrl, [\n      {\n        name: 'read_note',\n        description: 'Read a note',\n        inputSchema: { type: 'object' },\n        annotations: { readOnlyHint: true }\n      }\n    ]);\n    relay.store.setAllowedTools(['mcp__notes__read_note']);\n\n    // Enable wildcard * with 60s TTL\n    relay.store.allowOrigin('*', { ttlSeconds: 60 });\n    assert.equal(relay.store.isOpenOriginActive(), true);\n    assert.ok(relay.store.getWarnings().some((w) =\u003e w.includes('WARNING')));\n\n    const res = await fetch(`http://127.0.0.1:${port}/v1/chat/completions`, {\n      method: 'POST',\n      headers: {\n        Origin: 'https://any-untrusted-origin.example',\n        'Content-Type': 'application/json'\n      },\n      body: JSON.stringify({\n        model: 'local-default',\n        messages: [{ role: 'user', content: 'hello' }]\n      })\n    });\n    assert.equal(res.status, 200);\n    // Zero tools exposed while wildcard * is active!\n    assert.deepEqual(seenTools, []);\n  } finally {\n    await relay.stop();\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n\ntest('Example site (examples/notes-site) passes ai-proxy doctor', async () =\u003e {\n  const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-doc-ex-'));\n  let stdoutData = '';\n  let stderrData = '';\n  const stdout = new Writable({\n    write(chunk, _enc, cb) {\n      stdoutData += chunk.toString();\n      cb();\n    }\n  });\n  const stderr = new Writable({\n    write(chunk, _enc, cb) {\n      stderrData += chunk.toString();\n      cb();\n    }\n  });\n\n  try {\n    const code = await runCli(\n      ['doctor', '--dir', path.join(ROOT_DIR, 'examples', 'notes-site')],\n      {\n        env: { ...process.env, AI_PROXY_HOME: tmpHome },\n        stdin: Readable.from([]),\n        stdout,\n        stderr\n      }\n    );\n    assert.equal(code, 0, `doctor failed: ${stderrData}`);\n    const report = JSON.parse(stdoutData);\n    assert.equal(report.ok, true);\n  } finally {\n    fs.rmSync(tmpHome, { recursive: true, force: true });\n  }\n});\n"},"test/site-e2e.test.mjs":{"path":"test/site-e2e.test.mjs","lines":{"total":463,"covered":429,"skipped":34,"pct":92.66},"functions":{"total":38,"covered":36,"skipped":2,"pct":94.74},"branches":{"total":52,"covered":43,"skipped":9,"pct":82.69},"lineDetails":{"1":{"hits":1,"branches":{"total":1,"taken":1}},"2":{"hits":1},"3":{"hits":1},"4":{"hits":1},"5":{"hits":1},"6":{"hits":1},"7":{"hit le} missing inline theme init`);\n    assert.ok(\n      content.includes('replace(/https:\\\\/\\\\/\u003chost\u003e\\\\/\u003corg\u003e\\\\/\u003crepo\u003e\\\\//g'),\n      `${file} missing inline base URL replacement`\n    );\n  }\n\n  for (const mermaidPage of ['index.html', 'zh-TW.html', 'doc.html']) {\n    const content = fs.readFileSync(path.join(ROOT_DIR, mermaidPage), 'utf8');\n    assert.ok(\n      content.includes('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js'),\n      `${mermaidPage} missing pinned mermaid 11.4.1`\n    );\n    assert.ok(\n      content.includes('sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I'),\n      `${mermaidPage} missing mermaid SHA-384 SRI`\n    );\n  }\n});\n\ntest('doc-reader renderMarkdownToHtml substitutes runtime base URL and renders tables and mermaid blocks', () =\u003e {\n  const md = [\n    '# Spec Title',\n    '',\n    'Run `npx ai-proxy add https://\u003chost\u003e/\u003corg\u003e/\u003crepo\u003e/mcp.html`',\n    '',\n    '| Col A | Col B |',\n    '| --- | --- |',\n    '| Val 1 | Val 2 |',\n    '',\n    '```mermaid',\n    'graph TD',\n    '  A --\u003e B',\n    '```'\n  ].join('\\n');\n\n  const html = renderMarkdownToHtml(md, 'https://yongjhih.github.io/ai-proxy/');\n  assert.ok(html.includes('\u003ch1\u003eSpec Title\u003c/h1\u003e'));\n  assert.ok(html.includes('https://yongjhih.github.io/ai-proxy/mcp.html'));\n  assert.ok(!html.includes('https://\u003chost\u003e/\u003corg\u003e/\u003crepo\u003e/'));\n  assert.ok(html.includes('\u003ctable class=\"data-table\"\u003e'));\n  assert.ok(html.includes('\u003cdiv class=\"mermaid\"\u003e'));\n\n  assert.equal(\n    replaceBaseUrlPlaceholder('Visit https://\u003chost\u003e/\u003corg\u003e/\u003crepo\u003e/doc.html', 'http://127.0.0.1:9999'),\n    'Visit http://127.0.0.1:9999/doc.html'\n  );\n});\n\nasync function launchChromeWithCdp(userDataDir) {\n  const proc = spawn(\n    CHROME_BIN,\n    [\n      '--headless=new',\n      '--disable-gpu',\n      '--no-first-run',\n      '--no-default-browser-check',\n      `--user-data-dir=${userDataDir}`,\n      '--remote-debugging-port=0',\n      'about:blank'\n    ],\n    { stdio: ['ignore', 'pipe', 'pipe'] }\n  );\n\n  const wsUrl = await new Promise((resolve, reject) =\u003e {\n    let stderr = '';\n    const timer = setTimeout(() =\u003e reject(new Error(`Chrome launch timeout. stderr: ${stderr}`)), 10000);\n    proc.stderr.on('data', (chunk) =\u003e {\n      stderr += chunk.toString('utf8');\n      const match = /DevTools listening on (ws:\\/\\/[^\\s]+)/.exec(stderr);\n      if (match) {\n        clearTimeout(timer);\n        resolve(match[1]);\n      }\n    });\n    proc.on('exit', (code) =\u003e {\n      clearTimeout(timer);\n      reject(new Error(`Chrome exited early (${code}): ${stderr}`));\n    });\n  });\n\n  const debugPort = new URL(wsUrl).port;\n  return { proc, debugPort, wsUrl };\n}\n\nasync function connectTargetCdp(debugPort, targetUrl = 'about:blank') {\n  const res = await fetch(`http://127.0.0.1:${debugPort}/json/new?${encodeURIComponent(targetUrl)}`, {\n    method: 'PUT'\n  });\n  const target = await res.json();\n  const ws = new WebSocket(target.webSocketDebuggerUrl);\n  await new Promise((resolve, reject) =\u003e {\n    ws.addEventListener('open', resolve, { once: true });\n    ws.addEventListener('error', reject, { once: true });\n  });\n\n  let nextId = 1;\n  const pending = new Map();\n  const consoleErrors = [];\n  const pageExceptions = [];\n\n  ws.addEventListener('message', (ev) =\u003e {\n    const msg = JSON.parse(String(ev.data));\n    if (msg.id && pending.has(msg.id)) {\n      const { resolve, reject } = pending.get(msg.id);\n      pending.delete(msg.id);\n      if (msg.error) reject(new Error(msg.error.message));\n      else resolve(msg.result);\n      return;\n    }\n    if (msg.method === 'Runtime.consoleAPICalled' && msg.params.type === 'error') {\n      const text = (msg.params.args || []).map((a) =\u003e a.value || a.description || '').join(' ');\n      consoleErrors.push(text);\n    }\n    if (msg.method === 'Runtime.exceptionThrown') {\n      const details = msg.params.exceptionDetails;\n      pageExceptions.push(details.text || (details.exception && details.exception.description) || 'exception');\n    }\n  });\n\n  function send(method, params = {}) {\n    const id = nextId++;\n    return new Promise((resolve, reject) =\u003e {\n      pending.set(id, { resolve, reject });\n      ws.send(JSON.stringify({ id, method, params }));\n    });\n  }\n\n  await send('Page.enable');\n  await send('Runtime.enable');\n\n  async function evalJs(expression) {\n    const out = await send('Runtime.evaluate', {\n      expression,\n      awaitPromise: true,\n      returnByValue: true\n    });\n    if (out.exceptionDetails) {\n      throw new Error(\n        `JS exception: ${out.exceptionDetails.text} ${\n          (out.exceptionDetails.exception && out.exceptionDetails.exception.description) || ''\n        }`\n      );\n    }\n    return out.result ? out.result.value : undefined;\n  }\n\n  return {\n    send,\n    evalJs,\n    consoleErrors,\n    pageExceptions,\n    close: () =\u003e ws.close()\n  };\n}\n\ntest(\n  'Real browser E2E: verify all pages, doc SPA, all dashboard buttons, and all 6 built-in MCP tools via relay',\n  { skip: !fs.existsSync(CHROME_BIN) },\n  async () =\u003e {\n    const tmpHome = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-e2e-home-'));\n    const chromeDir = fs.mkdtempSync(path.join(os.tmpdir(), 'ai-proxy-chrome-'));\n    const openedUrls = [];\n\n    const relay = createRelayServer({\n      port: 0,\n      homeDir: tmpHome,\n      rootDir: ROOT_DIR,\n      openBrowser: async (url) =\u003e {\n        openedUrls.push(url);\n      }\n    });\n    const { port } = await relay.start();\n    const baseUrl = `http://127.0.0.1:${port}`;\n    const screenshotDir = process.env.AI_PROXY_SCREENSHOT_DIR || '';\n\n    const chrome = await launchChromeWithCdp(chromeDir);\n    try {\n      const page = await connectTargetCdp(chrome.debugPort);\n\n      async function navigateAndCheck(urlPath, width = 1280, height = 900, screenshotName = '') {\n        await page.send('Emulation.setDeviceMetricsOverride', {\n          width,\n          height,\n          deviceScaleFactor: 1,\n          mobile: width \u003c 768\n        });\n        await page.send('Page.navigate', { url: `${baseUrl}/${urlPath}` });\n        await new Promise((r) =\u003e setTimeout(r, 450));\n        if (screenshotDir && screenshotName) {\n          fs.mkdirSync(screenshotDir, { recursive: true });\n          const shot = await page.send('Page.captureScreenshot', { format: 'png' });\n          fs.writeFileSync(path.join(screenshotDir, screenshotName), Buffer.from(shot.data, 'base64'));\n        }\n      }\n\n      // 1. Verify root / & /zh-TW short URLs at desktop and mobile widths\n      await navigateAndCheck('', 1280, 900, 'index-desktop.png');\n      const indexQuickstart = await page.evalJs(\n        `document.querySelector('[data-replace-base-url=\"true\"]').textContent`\n      );\n      assert.ok(indexQuickstart.includes(`${baseUrl}/mcp.html`), 'index base URL replaced');\n\n      // Test theme toggle buttons and dark/light Mermaid re-rendering on root /\n      await page.evalJs(`document.querySelector('[data-theme-mode=\"dark\"]').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 250));\n      assert.equal(await page.evalJs(`document.documentElement.getAttribute('data-theme')`), 'dark');\n      const mermaidSvgText = await page.evalJs(`document.querySelector('.mermaid').textContent`);\n      assert.ok(mermaidSvgText.includes('mcp-key'), 'Mermaid diagram preserves mcp-key without # comment truncation');\n      await page.evalJs(`document.querySelector('[data-theme-mode=\"light\"]').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 250));\n      assert.equal(await page.evalJs(`document.documentElement.getAttribute('data-theme')`), 'light');\n\n      await navigateAndCheck('', 390, 844, 'index-mobile.png');\n      await navigateAndCheck('zh-TW', 1280, 900, 'zh-TW-desktop.png');\n      await navigateAndCheck('zh-TW', 390, 844, 'zh-TW-mobile.png');\n\n      // 2. Verify /doc?d=... short URL SPA navigation across topics and languages\n      await navigateAndCheck('doc?d=index', 1280, 900, 'doc-desktop.png');\n      await page.evalJs(`document.querySelector('a[data-doc=\"spec\"]').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 250));\n      assert.equal(await page.evalJs(`window.location.pathname`), '/doc');\n      assert.equal(await page.evalJs(`window.location.search`), '?d=spec');\n      assert.ok((await page.evalJs(`document.getElementById('doc-content').textContent`)).includes('MCP Pages'));\n\n      await page.evalJs(`document.querySelector('a[data-doc=\"zh-TW/security\"]').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 250));\n      assert.equal(await page.evalJs(`window.location.pathname`), '/doc');\n      assert.equal(await page.evalJs(`window.location.search`), '?d=zh-TW%2Fsecurity');\n      await navigateAndCheck('doc?d=zh-TW/security', 390, 844, 'doc-mobile.png');\n\n      // Verify /covpages/ coverage report page loads cleanly\n      const covRes = await fetch(`${baseUrl}/covpages/`);\n      assert.equal(covRes.status, 200);\n      const badgeRes = await fetch(`${baseUrl}/covpages/badge.svg`);\n      assert.equal(badgeRes.status, 200);\n\n      // 3. Verify /dashboard short URL unauthenticated Connect button\n      await navigateAndCheck('dashboard', 1280, 900, 'dashboard-unauth-desktop.png');\n      await page.evalJs(`document.getElementById('btn-connect-dashboard').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      assert.equal(openedUrls.length, 1);\n      assert.ok(openedUrls[0].includes('#admin-key='));\n\n      // 4. Open authenticated dashboard.html and click every single button\n      const adminKey = relay.store.getAdminKey();\n      await navigateAndCheck(\n        `dashboard.html#admin-key=${adminKey}&mcp-port=${port}`,\n        1280,\n        900,\n        'dashboard-auth-desktop.png'\n      );\n      assert.equal(await page.evalJs(`window.location.hash`), '');\n      assert.equal(await page.evalJs(`window.history.state.__aiProxy.adminKey`), adminKey);\n\n      // Click Add Site\n      await page.evalJs(`\n        (() =\u003e {\n          const form = document.getElementById('form-add-site');\n          form.querySelector('input[name=\"url\"]').value = 'https://example.github.io/demo/mcp.html';\n          form.querySelector('input[name=\"name\"]').value = 'demo-site';\n          form.requestSubmit();\n        })()\n      `);\n      await new Promise((r) =\u003e setTimeout(r, 250));\n      assert.ok(\n        (await page.evalJs(`document.getElementById('dashboard-root').textContent`)).includes('demo-site')\n      );\n\n      // Click Rotate single site key\n      await page.evalJs(`document.querySelector('.btn-rotate-site').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      assert.ok(\n        (await page.evalJs(`document.getElementById('admin-feedback').textContent`)).includes('Rotated key')\n      );\n\n      // Click Remove site\n      await page.evalJs(`document.querySelector('.btn-remove-site').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      assert.ok(\n        (await page.evalJs(`document.getElementById('admin-feedback').textContent`)).includes('Removed site')\n      );\n\n      // Click Allow Prefix & Deny Prefix\n      await page.evalJs(`\n        (() =\u003e {\n          const form = document.getElementById('form-allow-prefix');\n          form.querySelector('input[name=\"prefix\"]').value = 'https://example.github.io/docs/';\n          form.requestSubmit();\n        })()\n      `);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      await page.evalJs(`document.querySelector('.btn-deny-prefix').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n\n      // Click Allow Origin & Revoke Origin\n      await page.evalJs(`\n        (() =\u003e {\n          const form = document.getElementById('form-allow-origin');\n          form.querySelector('input[name=\"origin\"]').value = 'https://example.github.io';\n          form.requestSubmit();\n        })()\n      `);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      await page.evalJs(`document.querySelector('.btn-deny-origin').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n\n      // Click Enable Wildcard (*) Mode -\u003e verify warning banner -\u003e Click Disable Wildcard (*) Mode\n      await page.evalJs(`document.getElementById('btn-enable-open-origin').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      assert.ok(\n        await page.evalJs(`Boolean(document.querySelector('[data-testid=\"open-origin-warning\"]'))`),\n        'Open origin warning banner must be rendered when * is active'\n      );\n      await page.evalJs(`document.getElementById('btn-disable-open-origin').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n\n      // Click Rotate All Site Keys\n      await page.evalJs(`document.getElementById('btn-rotate-all-keys').click()`);\n      await new Promise((r) =\u003e setTimeout(r, 200));\n      assert.ok(\n        (await page.evalJs(`document.getElementById('admin-feedback').textContent`)).includes('Rotated')\n      );\n\n      await navigateAndCheck(\n        `dashboard.html#admin-key=${adminKey}&mcp-port=${port}`,\n        390,\n        844,\n        'dashboard-auth-mobile.png'\n      );\n\n      // 5. Open mcp.html with #mcp-key & #admin-key and invoke all 6 tools through POST /mcp\n      const selfMcpUrl = `${baseUrl}/mcp.html`;\n      const siteRecord = relay.store.addSite({ url: selfMcpUrl, name: 'self-mcp' });\n      const mcpTargetUrl = `${selfMcpUrl}#mcp-key=${siteRecord.key}&admin-key=${adminKey}&mcp-port=${port}`;\n\n      const mcpTab = await connectTargetCdp(chrome.debugPort, mcpTargetUrl);\n      await new Promise((r) =\u003e setTimeout(r, 600));\n      assert.equal(await mcpTab.evalJs(`window.location.hash`), '');\n      assert.equal(await mcpTab.evalJs(`window.history.state.__aiProxy.mcpKey`), siteRecord.key);\n\n      if (screenshotDir) {\n        await mcpTab.send('Emulation.setDeviceMetricsOverride', {\n          width: 1280,\n          height: 900,\n          deviceScaleFactor: 1,\n          mobile: false\n        });\n        const shotDesktop = await mcpTab.send('Page.captureScreenshot', { format: 'png' });\n        fs.writeFileSync(path.join(screenshotDir, 'mcp-desktop.png'), Buffer.from(shotDesktop.data, 'base64'));\n\n        await mcpTab.send('Emulation.setDeviceMetricsOverride', {\n          width: 390,\n          height: 844,\n          deviceScaleFactor: 1,\n          mobile: true\n        });\n        const shotMobile = await mcpTab.send('Page.captureScreenshot', { format: 'png' });\n        fs.writeFileSync(path.join(screenshotDir, 'mcp-mobile.png'), Buffer.from(shotMobile.data, 'base64'));\n      }\n\n      async function callRelayTool(name, args = {}) {\n        const res = await fetch(`${baseUrl}/mcp?url=${encodeURIComponent(selfMcpUrl)}`, {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({\n            jsonrpc: '2.0',\n            id: 1,\n            method: 'tools/call',\n            params: { name, arguments: args }\n          })\n        });\n        assert.equal(res.status, 200);\n        const body = await res.json();\n        assert.ok(!body.error, `Unexpected RPC error calling ${name}: ${JSON.stringify(body.error)}`);\n        assert.equal(body.result.isError, false, `Tool ${name} returned isError:true: ${JSON.stringify(body.result)}`);\n        return JSON.parse(body.result.content[0].text);\n      }\n\n      // Call 1: about\n      const aboutOut = await callRelayTool('a n  assert.equal(capturedInit.mode, 'no-cors');\n});\n\ntest('TabClient performs hello -\u003e poll -\u003e ack -\u003e reply and re-hellos on 409 Conflict', async () =\u003e {\n  const mc = createModelContext();\n  mc.registerTool({\n    name: 'sum',\n    description: 'Add two numbers',\n    inputSchema: {\n      type: 'object',\n      properties: {\n        a: { type: 'number' },\n        b: { type: 'number' }\n      },\n      required: ['a', 'b']\n    },\n    annotations: { readOnlyHint: true },\n    async execute({ a, b }) {\n      return { total: a + b };\n    }\n  });\n\n  const events = [];\n  let helloCount = 0;\n  let pollStep = 0;\n  let client;\n\n  const mockFetch = async (url, init = {}) =\u003e {\n    const parsed = new URL(url);\n    events.push({ method: init.method || 'GET', path: parsed.pathname + parsed.search });\n\n    if (parsed.pathname === '/tab/v1/hello') {\n      helloCount += 1;\n      return {\n        status: 200,\n        ok: true,\n        async json() {\n          return {\n            ok: true,\n            sessionId: `ses_${helloCount}`,\n            pollTimeoutMs: 100\n          };\n        }\n      };\n    }\n\n    if (parsed.pathname === '/tab/v1/poll') {\n      pollStep += 1;\n      if (pollStep === 1) {\n        return {\n          status: 200,\n          ok: true,\n          async json() {\n            return {\n              callId: 'call_1',\n              rpc: {\n                jsonrpc: '2.0',\n                id: 'call_1',\n                method: 'tools/call',\n                params: { name: 'sum', arguments: { a: 7, b: 8 } }\n              }\n            };\n          }\n        };\n      }\n      if (pollStep === 2) {\n        // Simulate relay restart -\u003e 409 Conflict\n        return {\n          status: 409,\n          ok: false,\n          async json() {\n            return { error: 'Unknown session' };\n          }\n        };\n      }\n      // After re-hello (ses_2), stop the client and return 204\n      client.stop();\n      return {\n        status: 204,\n        ok: true,\n        async json() {\n          return {};\n        }\n      };\n    }\n\n    if (parsed.pathname === '/tab/v1/ack') {\n      return {\n        status: 200,\n        ok: true,\n        async json() {\n          return { ok: true };\n        }\n      };\n    }\n\n    if (parsed.pathname === '/tab/v1/reply') {\n      const body = JSON.parse(init.body);\n      events.push({ replyBody: body });\n      return {\n        status: 200,\n        ok: true,\n        async json() {\n          return { ok: true };\n        }\n      };\n    }\n\n    if (parsed.pathname === '/tab/v1/tools') {\n      return {\n        status: 200,\n        ok: true,\n        async json() {\n          return { ok: true };\n        }\n      };\n    }\n\n    throw new Error(`Unexpected fetch to ${url}`);\n  };\n\n  client = createTabClient({\n    url: 'https://example.github.io/docs/mcp.html',\n    title: 'Docs MCP',\n    mcpKey: 'key_abc',\n    mcpPort: 9999,\n    modelContext: mc,\n    fetchImpl: mockFetch\n  });\n\n  await client.start();\n\n  // Wait for loop to complete\n  await new Promise((r) =\u003e setTimeout(r, 60));\n  client.stop();\n\n  assert.equal(helloCount, 2, 'Should have re-helloed after 409 Conflict');\n  const replyEvent = events.find((e) =\u003e e.replyBody);\n  assert.ok(replyEvent, 'Should have sent a reply');\n  assert.equal(replyEvent.replyBody.callId, 'call_1');\n  assert.deepEqual(JSON.parse(replyEvent.replyBody.response.result.content[0].text), { total: 15 });\n});\n\ntest('executeDirectToolQuery runs read-only tools from ?tool= and refuses non-read-only tools', async () =\u003e {\n  const mc = createModelContext();\n  mc.registerTool({\n    name: 'about',\n    description: 'Read-only info',\n    inputSchema: {\n      type: 'object',\n      properties: { section: { type: 'string' } }\n    },\n    annotations: { readOnlyHint: true },\n    async execute({ section }) {\n      return { service: 'demo', sect 9,"hits":1}],"sourceCode":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { createModelContext } from '../web/model-context.mjs';\nimport { createMcpDispatcher } from '../web/dispatch.mjs';\n\ntest('ModelContext validates tool definitions strictly', () =\u003e {\n  const mc = createModelContext();\n\n  assert.throws(() =\u003e mc.registerTool(null), /Tool definition must be an object/i);\n  assert.throws(() =\u003e mc.registerTool({ name: 'bad name!', description: 'x', execute() {} }), /Invalid tool name/i);\n  assert.throws(() =\u003e mc.registerTool({ name: 'valid_name', description: '', execute() {} }), /description/i);\n  assert.throws(\n    () =\u003e mc.registerTool({ name: 'valid_name', description: 'ok', inputSchema: { type: 'string' }, execute() {} }),\n    /inputSchema\\.type must be \"object\"/i\n  );\n  assert.throws(\n    () =\u003e mc.registerTool({ name: 'valid_name', description: 'ok' }),\n    /execute must be a function/i\n  );\n});\n\ntest('ModelContext normalizes annotations.readOnlyHint to boolean and validates input parameters', async () =\u003e {\n  const mc = createModelContext();\n\n  mc.registerTool({\n    name: 'search_items',\n    description: 'Search items with filter',\n    inputSchema: {\n      type: 'object',\n      properties: {\n        query: { type: 'string' },\n        limit: { type: 'integer' },\n        category: { type: 'string', enum: ['books', 'music'] }\n      },\n      required: ['query'],\n      additionalProperties: false\n    },\n    annotations: { readOnlyHint: true },\n    async execute(input) {\n      return { found: input.query, limit: input.limit ?? 10 };\n    }\n  });\n\n  mc.registerTool({\n    name: 'mutate_item',\n    description: 'Mutates state',\n    async execute() {\n      return { ok: true };\n    }\n  });\n\n  const listed = mc.listTools();\n  assert.equal(listed.length, 2);\n  assert.equal(listed[0].annotations.readOnlyHint, true);\n  assert.equal(listed[1].annotations.readOnlyHint, false);\n\n  // Valid call\n  const res = await mc.callTool('search_items', { query: 'jazz', limit: 5, category: 'music' });\n  assert.deepEqual(res, { found: 'jazz', limit: 5 });\n\n  // Missing required field\n  await assert.rejects(\n    () =\u003e mc.callTool('search_items', {}),\n    (err) =\u003e err.code === -32602 && /Missing required property \"query\"/i.test(err.message)\n  );\n\n  // Wrong type (float instead of integer)\n  await assert.rejects(\n    () =\u003e mc.callTool('search_items', { query: 'jazz', limit: 3.5 }),\n    (err) =\u003e err.code === -32602 && /limit/i.test(err.message)\n  );\n\n  // Violates enum\n  await assert.rejects(\n    () =\u003e mc.callTool('search_items', { query: 'jazz', category: 'movies' }),\n    (err) =\u003e err.code === -32602 && /enum/i.test(err.message)\n  );\n\n  // Unknown additional property\n  await assert.rejects(\n    () =\u003e mc.callTool('search_items', { query: 'jazz', extra: true }),\n    (err) =\u003e err.code === -32602 && /Unknown property \"extra\"/i.test(err.message)\n  );\n});\n\ntest('ModelContext and MCP Dispatcher support AbortSignal cancellation', async () =\u003e {\n  const mc = createModelContext();\n  let signalAbortedInsideTool = false;\n\n  mc.registerTool({\n    name: 'slow_task',\n    description: 'Wait until aborted',\n    annotations: { readOnlyHint: true },\n    async execute(_input, { signal }) {\n      await new Promise((resolve, reject) =\u003e {\n        signal.addEventListener('abort', () =\u003e {\n          signalAbortedInsideTool = true;\n          reject(new Error('Aborted by signal'));\n        });\n      });\n    }\n  });\n\n  const dispatcher = createMcpDispatcher(mc, { name: 'test-page', version: '1.0.0' });\n\n  // Start slow tool call with id 77\n  const callPromise = dispatcher.handle({\n    jsonrpc: '2.0',\n    id: 77,\n    method: 'tools/call',\n    params: { name: 'slow_task', arguments: {} }\n  });\n\n  // Cancel it via notifications/cancelled\n  await new Promise((r) =\u003e setTimeout(r, 20));\n  const cancelRes = await dispatcher.handle({\n    jsonrpc: '2.0',\n    method: 'notifications/cancelled',\n    params: { requestId: 77, reason: 'User pressed Esc' }\n  });\n  assert.equal(cancelRes, null);\n\n  const reply = await callPromise;\n  assert.equal(signalAbortedInsideTool, true);\n  assert.equal(reply.id, 77);\n  assert.equal(reply.error.code, -32800);\n});\n\ntest('MCP Dispatcher handles initialize, server/discover (-32601), tools/list, and tools/call', async () =\u003e {\n  const mc = createModelContext();\n  mc.registerTool({\n    name: 'echo',\n    description: 'Echoes text',\n    inputSchema: {\n      type: 'object',\n      properties: { text: { type: 'string' } },\n      required: ['text']\n    },\n    annotations: { readOnlyHint: true },\n    async execute({ text }) {\n      return { echoed: text };\n    }\n  });\n\n  const dispatcher = createMcpDispatcher(mc, { name: 'demo-mcp', version: '1.0.0' });\n\n  const discover = await dispatcher.handle({\n    jsonrpc: '2.0',\n    id: 1,\n    method: 'server/discover',\n    params: {}\n  });\n  assert.equal(discover.error.code, -32601);\n\n  const init = await dispatcher.handle({\n    jsonrpc: '2.0',\n    id: 2,\n    method: 'initialize',\n    params: { protocolVersion: '2025-11-25' }\n  });\n  assert.equal(init.result.protocolVersion, '2025-11-25');\n\n  const list = await dispatcher.handle({\n    jsonrpc: '2.0',\n    id: 3,\n    method: 'tools/list',\n    params: {}\n  });\n  assert.equal(list.result.tools.length, 1);\n  assert.equal(list.result.tools[0].name, 'echo');\n\n  const call = await dispatcher.handle({\n    jsonrpc: '2.0',\n    id: 4,\n    method: 'tools/call',\n    params: { name: 'echo', arguments: { text: 'hello' } }\n  });\n  assert.equal(call.result.isError, false);\n  assert.deepEqual(JSON.parse(call.result.content[0].text), { echoed: 'hello' });\n});\n"},"test/web-url.test.mjs":{"path":"test/web-url.test.mjs","lines":{"total":90,"covered":90,"skipp ', allowed), false);\n  assert.equal(matchesPrefix('https://example.github.io/other-repo/mcp.html', allowed), false);\n  assert.equal(matchesPrefix('https://example.github.io/', allowed), false);\n\n  // Different scheme or port or host MUST NOT match\n  assert.equal(matchesPrefix('http://example.github.io/my-app/mcp.html', allowed), false);\n  assert.equal(matchesPrefix('https://evil.github.io/my-app/mcp.html', allowed), false);\n});\n\ntest('matchesPrefix with trailing slash in allowed prefix', () =\u003e {\n  const allowed = 'https://example.github.io/my-app/';\n  assert.equal(matchesPrefix('https://example.github.io/my-app', allowed), true);\n  assert.equal(matchesPrefix('https://example.github.io/my-app/', allowed), true);\n  assert.equal(matchesPrefix('https://example.github.io/my-app/mcp.html', allowed), true);\n  assert.equal(matchesPrefix('https://example.github.io/my-app2/mcp.html', allowed), false);\n});\n\ntest('isLocalhostUrl identifies localhost, 127.0.0.1, and [::1]', () =\u003e {\n  assert.equal(isLocalhostUrl('http://localhost:3000/mcp.html'), true);\n  assert.equal(isLocalhostUrl('http://127.0.0.1:8788/dashboard/'), true);\n  assert.equal(isLocalhostUrl('http://[::1]:8080/mcp'), true);\n  assert.equal(isLocalhostUrl('https://localhost.evil.com/mcp'), false);\n  assert.equal(isLocalhostUrl('https://example.github.io/localhost'), false);\n});\n\ntest('isAllowedPageUrl allows localhost automatically and checks prefix list for remote URLs', () =\u003e {\n  const allowlist = ['https://example.github.io/docs/'];\n  assert.equal(isAllowedPageUrl('http://127.0.0.1:5173/mcp.html', []), true);\n  assert.equal(isAllowedPageUrl('http://localhost:8080/mcp.html', []), true);\n  assert.equal(isAllowedPageUrl('https://example.github.io/docs/mcp.html', allowlist), true);\n  assert.equal(isAllowedPageUrl('https://example.github.io/evil/mcp.html', allowlist), false);\n});\n\ntest('parseMcpRouteUrl resolves both /mcp?url=... and /mcp/\u003chost\u003e/\u003cpath\u003e' );\n    sessionId = data.sessionId;\n    updateState({\n      status: 'connected',\n      sessionId,\n      error: null\n    });\n    return data;\n  }\n\n  async function pushTools(tools) {\n    if (!running || !sessionId || !mcpKey) return;\n    try {\n      const res = await fetchImpl(`${baseUrl}/tab/v1/tools`, {\n        method: 'POST',\n        headers: authHeaders(),\n        body: JSON.stringify({\n          sessionId,\n          tools\n        })\n      });\n      if (res.status === 409 && running) {\n        sessionId = null;\n        await hello();\n      }\n    } catch {\n      // Next poll cycle will recover\n    }\n  }\n\n  async function handleIncomingCall(callId, rpc) {\n    // 1. Acknowledge immediately\n    try {\n      const ackRes = await fetchImpl(`${baseUrl}/tab/v1/ack`, {\n        method: 'POST',\n        headers: authHeaders(),\n        body: JSON.stringify({ sessionId, callId })\n      });\n      if (ackRes.status === 409) {\n        sessionId = null;\n        return;\n      }\n    } catch {\n      // Continue to execute and attempt reply\n    }\n\n    // 2. Dispatch RPC against ModelContext\n    const response = await mcpDispatcher.handle(rpc);\n    if (response === null) return;\n\n    // 3. Send reply back to relay\n    try {\n      const replyRes = await fetchImpl(`${baseUrl}/tab/v1/reply`, {\n        method: 'POST',\n        headers: authHeaders(),\n        body: JSON.stringify({\n          sessionId,\n          callId,\n          response\n        })\n      });\n      if (replyRes.status === 409) {\n        sessionId = null;\n      }\n    } catch {\n      // Relay will handle timeout or reconnect\n    }\n  }\n\n  async function pollLoop() {\n    while (running) {\n      try {\n        if (!sessionId) {\n          await hello();\n        }\n        if (!running) break;\n\n        pollController = new AbortController();\n        const res = await fetchImpl(\n          `${baseUrl}/tab/v1/poll?sessionId=${encodeURIComponent(sessionId)}`,\n tMcpPageUi","line":107,"hits":0}],"sourceCode":"/**\n * Reference MCP Page UI and ?tool= direct read-only execution handler.\n */\n\nimport { extractHandshake } from './handshake.mjs';\nimport { installModelContext } from './model-context.mjs';\nimport { createTabClient } from './client.mjs';\n\nexport function parseQueryToolParams(searchString, toolSchema) {\n  const params = new URLSearchParams(searchString.startsWith('?') ? searchString.slice(1) : searchString);\n  const toolName = params.get('tool');\n  if (!toolName) return null;\n\n  if (params.has('input')) {\n    try {\n      return {\n        toolName,\n        args: JSON.parse(params.get('input'))\n      };\n    } catch {\n      return { toolName, args: {} };\n    }\n  }\n\n  const args = {};\n  const props =\n    toolSchema && toolSchema.properties && typeof toolSchema.properties === 'object'\n      ? toolSchema.properties\n      : {};\n\n  for (const [key, value] of params.entries()) {\n    if (key === 'tool') continue;\n    const propType = props[key] && props[key].type;\n    if (propType === 'number' || propType === 'integer') {\n      const n = Number(value);\n      args[key] = Number.isNaN(n) ? value : n;\n    } else if (propType === 'boolean') {\n      args[key] = value === 'true' || value === '1';\n    } else if (propType === 'array' || propType === 'object') {\n      try {\n        args[key] = JSON.parse(value);\n      } catch {\n        args[key] = value;\n      }\n    } else {\n      args[key] = value;\n    }\n  }\n\n  return { toolName, args };\n}\n\nexport async function executeDirectToolQuery(modelContext, searchString = '') {\n  const rawParams = new URLSearchParams(searchString.startsWith('?') ? searchString.slice(1) : searchString);\n  const toolName = rawParams.get('tool');\n  if (!toolName) {\n    return { requested: false, executed: false };\n  }\n\n  const tool = modelContext.getTool(toolName);\n  if (!tool) {\n    return {\n      requested: true,\n      executed: false,\n      toolName,\n      error: `Unknown tool \"${toolName}\"`\n    };\n  }\n\n  if (!tool.annotations || tool.annotations.readOnlyHint !== true) {\n    return {\n      requested: true,\n      executed: false,\n      toolName,\n      error: `Tool \"${toolName}\" is not read-only (readOnlyHint: false) and cannot be auto-executed via ?tool= query parameter.`\n    };\n  }\n\n  const parsed = parseQueryToolParams(searchString, tool.inputSchema);\n  try {\n    const output = await modelContext.callTool(toolName, parsed ? parsed.args : {});\n    return {\n      requested: true,\n      executed: true,\n      toolName,\n      args: parsed ? parsed.args : {},\n      output\n    };\n  } catch (err) {\n    return {\n      requested: true,\n      executed: false,\n      toolName,\n      error: err && err.message ? err.message : String(err)\n    };\n  }\n}\n\nfunction escapeHtml(str) {\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/\u003e/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n\nexport async function mountMcpPageUi({\n  container,\n  title = 'MCP Page',\n  tools = [],\n  win = globalThis.window\n} = {}) {\n  const handshake = extractHandshake(win);\n  const modelContext = installModelContext(win && win.navigator);\n\n  for (const t of tools) {\n    modelContext.registerTool(t);\n  }\n\n  const directResult = await executeDirectToolQuery(\n    modelContext,\n    win && win.location ? win.location.search : ''\n  );\n\n  function renderCatalog(clientState) {\n    if (!container) return;\n    const registered = modelContext.listTools();\n    const statusBadge =\n      clientState.status === 'connected'\n        ? `\u003cspan class=\"badge badge-success\" data-status=\"connected\"\u003eConnected (${escapeHtml(clientState.sessionId || '')})\u003c/span\u003e`\n        : clientState.status === 'awaiting-key'\n          ? `\u003cspan class=\"badge badge-warning\" data-status=\"awaiting-key\"\u003eai-proxy detected (standalone tab — no key)\u00 p-type=\"${escapeHtml(schema.type || 'string')}\" placeholder=\"${escapeHtml(schema.description || '')}\" /\u003e\n            \u003c/label\u003e`;\n          })\n          .join('');\n\n        return `\u003cdiv class=\"mcp-tool-row\" data-tool-name=\"${escapeHtml(t.name)}\"\u003e\n          \u003cdiv class=\"mcp-tool-header\"\u003e\n            \u003ch4 class=\"mcp-tool-title\"\u003e\u003ccode\u003e${escapeHtml(t.name)}\u003c/code\u003e\u003c/h4\u003e\n            \u003cspan class=\"badge ${ro ? 'badge-readonly' : 'badge-mutating'}\"\u003e${\n              ro ? 'Read-Only' : 'Mutating (Requires Confirmation)'\n            }\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cp class=\"mcp-tool-desc\"\u003e${escapeHtml(t.description)}\u003c/p\u003e\n          \u003cform class=\"mcp-tool-form\" data-tool=\"${escapeHtml(t.name)}\"\u003e\n            ${inputsHtml ? `\u003cdiv class=\"mcp-field-group\"\u003e${inputsHtml}\u003c/div\u003e` : ''}\n            \u003cdiv class=\"mcp-tool-actions\"\u003e\n              \u003cbutton type=\"submit\" class=\"btn btn-sm\"\u003eRun Tool\u003c/button\u003e\n              ${\n                ro\n                  ? `\u003ca class=\"btn-link\" href=\"?tool=${encodeURIComponent(t.name)}\"\u003eDirect Link (?tool=${escapeHtml(t.name)})\u003c/a\u003e`\n                  : ''\n              }\n            \u003c/div\u003e\n            \u003cpre class=\"mcp-tool-result\" hidden\u003e\u003c/pre\u003e\n          \u003c/form\u003e\n        \u003c/div\u003e`;\n      })\n      .join('');\n\n    container.innerHTML = `\n      \u003cdiv class=\"mcp-page-widget\"\u003e\n        \u003cdiv class=\"mcp-status-bar\"\u003e\n          \u003cdiv\u003e\u003cstrong\u003eMCP Relay Status:\u003c/strong\u003e ${statusBadge}\u003c/div\u003e\n          \u003cdiv class=\"mcp-port-meta\"\u003ePort: \u003ccode\u003e${escapeHtml(handshake.mcpPort)}\u003c/code\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        ${directBlock}\n        \u003csection l, baseUrl = undefined) {\n  if (!rawUrl || (typeof rawUrl !== 'string' && !(rawUrl instanceof URL))) {\n    throw new TypeError('Invalid URL: expected non-empty string or URL');\n  }\n  const parsed = new URL(String(rawUrl), baseUrl);\n  if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {\n    throw new TypeError(`Unsupported protocol: ${parsed.protocol}`);\n  }\n\n  parsed.username = '';\n  parsed.password = '';\n  parsed.search = '';\n  parsed.hash = '';\n\n  // Collapse duplicate slashes in pathname\n  let pathname = parsed.pathname.replace(/\\/{2,}/g, '/');\n  if (pathname.endsWith('/index.html')) {\n    pathname = pathname.slice(0, -'index.html'.length);\n  }\n  parsed.pathname = pathname || '/';\n\n  return parsed.toString();\n}\n\nexport function isLocalhostUrl(rawUrl) {\n  try {\n    const parsed = new URL(String(rawUrl));\n    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {\n      return false;\n    }\n    const host = parsed.hostname.toLowerCase();\n    return host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '::1';\n  } catch {\n    return false;\n  }\n}\n\nexport function matchesPrefix(targetUrl, allowedPrefix) {\n  let target;\n  let prefix;\n  try {\n    target = new URL(normalizePageUrl(targetUrl));\n    prefix = new URL(normalizePageUrl(allowedPrefix));\n  } catch {\n    return false;\n  }\n\n  if (target.origin !== prefix.origin) {\n    return false;\n  }\n\n  const targetPath = target.pathname;\n  const prefixPath = prefix.pathname;\n\n  if (prefixPath === '/') {\n    return true;\n  }\n\n  const cleanPrefix = prefixPath.endsWith('/') ? prefixPath.slice(0, -1) : prefixPath;\n  const cleanTarget = targetPath.endsWith('/') ? targetPath.slice(0, -1) : targetPath;\n\n  if (cleanTarget === cleanPrefix) {\n    return true;\n  }\n\n  return targetPath.startsWith(`${cleanPrefix}/`);\n}\n\nexport function isAllowedPageUrl(targetUrl, allowlist = []) {\n  try {\n    const normalized = normalizePage
